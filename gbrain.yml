# gbrain configuration for GoalChain
# Source configuration (tier 1 in 7-tier resolution chain)
# Points to the gStack source for this project
source: "gstack-code-goalchain"

# Schema pack selection (tier 5 in 7-tier resolution chain)
# Options: gbrain-base (default), gbrain-recommended (extended), or custom pack name
schema:
  pack: "gbrain-recommended"

# Storage tiering configuration
# db_tracked: Directories versioned in git — human-curated markdown content
# db_only: Directories stored only in Supabase/PGLite — machine-generated, auto-gitignored by `gbrain sync`
storage:
  db_tracked:
    - "docs/"
    - "prompts/"
    - "research/"
  db_only:
    - ".opencode/"
    - "scratch/"
    - ".tmp.drivedownload/"
    - ".tmp.driveupload/"
    - "assets/"
    - "data/"