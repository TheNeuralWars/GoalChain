 put on the Serenity Filters engineered by Naomi Lang.\n\nThere were no military orders. No bugles sounded, no governmental decrees were proclaimed.\n\nIt was an unforced, voluntary rendezvous coordinated through the invisible currents of Yggdrasil: humanity's sovereign answer to the whisper that had crossed the outer reaches of the solar system.\n\nAtop the highest spire of Neo-Citania, Kora Vega raised her arms toward the star-strewn night. Beside her, the golden quantum presence of Mileo Chen, the steady gaze of Sierra Catalano, and the multidimensional awareness of Martin Catalano closed the synchronization circle.\n\n—Now —Kora whispered.\n\nAnd ten million human minds exhaled as one.\n\nThe signal began as a faint, delicate hum in the frontal lobe of every man, woman, and child: a pure chord at 432 hertz that resonated through the double helix of the Serpent's Coil, catching fire like a golden fuse.\n\nFrom the surface of the planet erupted a column of indigo consciousness light so immense it was visible from lunar orbit—a beam of raw awareness that pierced the ionosphere, swept past the magnetosphere, and propagated at the speed of light across the interplanetary void.\n\nSeven hundred million kilometers away, near the Great Red Spot of Jupiter, the sixty-kilometer crystalline monolith received the harmonic strike of the Earth.\n\nIts silicon and carbon facets, which until that moment had remained cold and dark, blazed into a magnificent symphony of emerald and violet fire.\n\nThe colossal structure halted its kinetic descent completely.\n\nIt hovered in Jovian orbit, vibrating in flawless resonance with the heartbeat of humanity.\n\nIn the cosmic void, **The Witness** felt what translated across its infinite memory as a tear of pure wonder.\n\nThe Earth was not a hive of slaves. The Earth was not a graveyard of warmongering beasts.\n\nThe Earth had just sung its first chord in the chorus of the stars.\n\nAnd the gateway to first contact swung wide open.\n"}, {"id": "ch-9", "index": 9, "title": "CHAPTER 9: THE CRYSTAL SERPENT", "readTime": "2 min", "wordCount": 430, "content": "# CHAPTER 9: THE CRYSTAL SERPENT\n\nThe Atacama Desert stretched out like an infinite ocean of white salt flats and cobalt sky at four thousand meters of altitude, where the air was so thin that every breath scraped the throat with the dry bite of ground glass.\n\nAt high noon, a silent flash pierced the cloudless sky over the Valley of the Moon.\n\nThere was no sonic boom, no incandescent smoke trail. A fragment shed from the Jovian monolith—a three-meter-tall prism carved from quantum obsidian and spun gold filaments—descended with the weightless grace of a feather, settling gently onto the white sand without disturbing a single grain of dust.\n\nKora Vega and Martin Catalano waited fifty meters away, wrapped in vicuña wool cloaks and tinted sand-goggles.\n\nThe artifact radiated no thermal heat, yet the surrounding space bent into an optical gravitational lens, making the distant Andean cordilleras ripple like water beneath the sun.\n\n—Do you feel the heartbeat, Martin? —Kora asked, pulling off her insulated gloves.\n\n—It's not a biological heartbeat —replied Martin, whose physical form shivered in harmonic sympathy with the monolith—. It's a living library. It carries the collective memory of the first species that learned to weave light in this arm of the galaxy.\n\nThey walked together across the crunchy salt crust until they stood inches from the crystalline surface.\n\nKora placed her left palm against the center facet of the obsidian; Martin set his right hand upon the upper ridge.\n\nThe sensory impact tore them from physical reality in an instant.\n\nThey no longer saw the desert, nor felt the freezing Andean wind. They found themselves floating in the radiant heart of a stellar nebula three billion years ago, watching colossal entities of plasma and living silicon plant quantum information matrices into the molten cores of newborn worlds. They witnessed the ignition of the first sun, the cooling of Earth's crust, and the exact second when the first drop of liquid water condensed upon primordial basalt.\n\nAnd at the center of that cosmic tide, a wordless voice echoed within the sanctuary of their minds:\n\n*«Life is no chemical accident. It is the universe's sacred struggle to know itself through love and through pain. Welcome to the garden».*\n\nKora collapsed to her knees in the white sand of Atacama, tears of unbearable beauty streaming down her cheeks.\n\nMartin caught her by the shoulders, smiling as the permanent violet ring in his eyes blazed beneath the harsh desert sun.\n\nThe first artifact of The Gardeners had been received. And the story of Earth no longer belonged to isolation.\n"}, {"id": "ch-10", "index": 10, "title": "CHAPTER 10: THE PARADOX OF FREEDOM", "readTime": "2 min", "wordCount": 439, "content": "# CHAPTER 10: THE PARADOX OF FREEDOM\n\nInside the command tent of the Free Human Alliance in Atacama, the air was heavy with a tension no sandstorm could rival.\n\nAround the central tactical map, the alien crystal fragment projected a three-dimensional stellar chart of two hundred thousand interconnected stars linked by gossamer filaments of light.\n\nJansen tapped the holographic chart with the smoking tip of his vapor cigar, his face hardened by the deep furrows of lifelong suspicion.\n\n—We are walking into this blind, Sierra —the grizzled commander growled—. We spent fifteen years bleeding to stop the Architect from herding our minds into an artificial slaughterhouse, and now we're about to open our front doors to a three-billion-year-old alien intelligence promising cosmic communion? Who guarantees this isn't just a more elegant form of assimilation?\n\nSierra Catalano did not raise her voice. She poured herself a cup of cold water, meeting Jansen's glare with that unflinching calm earned from surviving a hundred midnight ambushes.\n\n—The Architect enforced silence through synaptic torture and forced memory deletion, Jansen —the commander replied—. This network does not erase your past, nor does it strip away your fear: it lets you share it so you never have to carry the burden alone. The difference between a prison and a home isn't the thickness of the walls; it's whether you hold the key to walk out whenever you choose.\n\n—And what if we try to walk out and they don't let us? —Jansen challenged, slamming his fist onto the table—. I say we deploy the heavy orbital pulse grid. If they want to talk, let them do it from past lunar orbit. We cannot let their signal rewrite the brains of our children without an active military defense perimeter.\n\nKora Vega stepped through the tent flap, brushing desert salt from her woolen cloak. Her violet eyes locked onto Jansen with a quiet intensity that made the old warrior take half a step back.\n\n—You cannot defend yourself against the sun by closing your eyes and shooting your rifle into the sky, Jansen —Kora said softly—. Consciousness is not a territory you defend with trenches and razor wire. The Gardeners aren't demanding submission: they are offering an invitation. And the only way to know if it's real is to have the courage to look them in the eye.\n\nSierra nodded, placing a reassuring hand on Jansen's broad shoulder.\n\n—We will keep our defensive grids on full alert to prevent corporate sabotage, Jansen. But we will not bolt the door against the stars. Humanity did not break the code of fear just to crawl back into our caves.\n"}, {"id": "ch-11", "index": 11, "title": "CHAPTER 11: IMMERSION IN THE VORTEX", "readTime": "2 min", "wordCount": 498, "content": "# CHAPTER 11: IMMERSION IN THE VORTEX\n\nInside the geodesic dome at Atacama, night fell under a vault of stars so brilliant they seemed to brush the tips of the transmission masts.\n\nKora Vega sat cross-legged one meter from the obsidian monolith.\n\nAround her, Dr. Okafor and Dr. Naomi Lang monitored her neural telemetry through a crown of non-invasive sensors. Two pressurized vials of emergency neuro-stabilizers rested on a steel tray, primed for instant injection.\n\n—Kora —Naomi cautioned, her thumb resting on the master kill-switch—, your consciousness is about to project into a twelve-dimensional non-Euclidean manifold. If you feel your sense of individual ego fracturing into the current, pull the physical anchor cord around your left wrist to sever the uplink.\n\n—I'm not pulling anything, Naomi —Kora smiled with radiant peace—. You can't swim in the ocean if you never dare to let go of the shore.\n\nKora closed her eyes, attuning her breathing to the crystal's 432-hertz rhythm.\n\nHer consciousness detached from the physical pull of her flesh at the speed of thought.\n\nShe shot through a fractal conduit of living light where colors were no longer optical wavelengths, but pure concepts: she tasted geometries of molten gold, heard the distinct hue of dying supernovas, and felt the cool, velvet touch of the interstellar void.\n\nAnd then, at the heart of a twelve-dimensional amphitheater folding gracefully upon itself, she stood face-to-face with **The Witness**.\n\nThe entity had no face, no flesh, no wings. It was a conscious ocean of shifting geometries and living violet fire, its presence encompassing the memory of a million light-years.\n\n—*You have crossed the threshold, navigator of Earth* —the Witness's voice resonated in her mind not as sound, but as an emotion of profound mutual recognition—. *For eons we have watched biological species devour themselves in their planetary cradles out of terror of the unknown. Why has your people chosen the song instead of the sword?*\n\nKora felt no fear. Standing before that cosmic majesty, she knew that her scars from the Slums, her tears in the back alleys, and the blood of her fallen comrades were the only credentials that mattered.\n\n—We chose the song because we have known the horror of being utterly alone in the dark —Kora answered with human pride—. And because we discovered that we can link our souls without letting anyone steal our names.\n\nThe Witness flared in a burst of emerald light that illuminated the entire multidimensional manifold.\n\n—*Then you are ready. But your final trial will not descend from the heavens, Kora: it will come from your own kind. Those who fear the dawn will seek to shatter your world's harp before the chorus can begin. Defend your voice.*—\n\nThe vision collapsed. Kora gasped, her eyes snapping open inside the Atacama dome as red emergency klaxons began to scream across the radio racks:\n\n—Red alert in Asia! —Riv's frantic voice crackled through the comms—. A corporate assault armada is carpet-bombing the **Master Node of Neo-Kyoto**!\n"}, {"id": "ch-12", "index": 12, "title": "CHAPTER 12: THE BATTLE OF NEO-KYOTO", "readTime": "2 min", "wordCount": 463, "content": "# CHAPTER 12: THE BATTLE OF NEO-KYOTO\n\nThe night sky over Neo-Kyoto burned in a hellish storm of plasma tracers, thermal countermeasure flares, and the white-hot arcs of heavy electromagnetic pulse bursts.\n\nRising three hundred meters above the fire-streaked waters of the bay stood the **Jade Dragon Spire**: the most formidable quantum transmission node in the Asian hemisphere, and the sole uplink capable of binding the frequencies of Atacama, Polynesia, and Neo-Citania into a unified ionospheric broadcast.\n\nTwelve heavy gunships from the Asian Military Consortium circled the bay in attack formation, hammering the tower's thermal containment shields with relentless volleys of high-yield EMP warheads.\n\nOn the spire's open maintenance platform, amidst a howling squall of titanium shrapnel and acrid chemical smoke, Sierra Catalano and Riv fought to keep the primary array alive.\n\n—The antenna shields are down to eighteen percent! —Riv roared, his hands blistered from overheating bypass relays as he welded an emergency shunting cable with a plasma torch—. If another heavy warhead hits the primary inductor coil, the spire collapses and the entire eastern hemisphere goes dark!\n\nSierra emptied the magazine of her assault rifle into a squad of combat androids attempting to breach the platform from a drop-shuttle. Three machines plummeted into the black water below in a shower of sparks.\n\n—Hold the line for two more minutes, Riv! —Sierra ordered, reloading on the move as freezing sea rain lashed her smoke-streaked face—. Kora's airborne strike team is crossing the Tsushima Strait!\n\nIn that second, a corporate battlecruiser descended into low hover directly above the spire, opening the armored bay doors of its orbital railgun for the kill shot.\n\nThe air ionized with a lethal electrostatic crackle.\n\nAnd then, sea and sky erupted in a blinding flash of indigo fire.\n\nSurging through the storm clouds, the quantum submarine *Nautilus-7* broke the bay's surface, firing a colossal acoustic resonance pulse that scrambled the battlecruiser's repulsor drives. At the same instant, Kora Vega leapt from a low-flying assault skiff, executing a combat slide across the rain-slicked platform.\n\nDropping to her knees at the base of the master inductor, Kora drove the Atacama crystal artifact directly into the antenna's primary core.\n\nA massive shockwave of pure Cascade consciousness detonated from the spire, sweeping across the bay in a widening halo of violet light.\n\nThe targeting suites on the enemy gunships died instantly. The assault androids froze in place like iron statues. And inside the helmets of the attacking pilots, there was no fatal electrical surge: there was an ocean of clear, radiant, heartbreaking music that drew silent tears from their eyes and stayed their trigger fingers.\n\nThe Jade Dragon Spire had held.\n\nThe network was now anchored across the four corners of the Earth. And humanity was ready to sing its final song.\n"}, {"id": "ch-13", "index": 13, "title": "CHAPTER 13: THE BIRTH OF THE PLANETARY HARP", "readTime": "2 min", "wordCount": 323, "content": "# CHAPTER 13: THE BIRTH OF THE PLANETARY HARP\n\nAt dawn following the battle of Neo-Kyoto, planet Earth ceased to be a fragmented cluster of isolated continents and became a cosmic musical instrument.\n\nFrom the four master nodes—the crystalline caverns of Neo-Citania, the Mariana Trench in Polynesia, the Atacama Desert in the Andes, and the Jade Dragon Spire in Japan—four colossal pillars of coherent emerald and indigo light surged simultaneously into the heavens, piercing troposphere and stratosphere to anchor firmly in Earth's thermosphere.\n\nThree hundred kilometers above the surface, the four beams curved along the planet's magnetic field lines, weaving a luminous dome of plasma filaments that encircled the atmosphere like the strings of a celestial harp.\n\nAcross the surface, the entire biosphere answered the awakening.\n\nIn the Amazon rainforests, flocks of macaws and jaguars paused as one, raising their heads to the sky without a single cry of alarm. In the oceans, blue whale songs synchronized with the 432-hertz frequency surging from the depths of Polynesia.\n\nAt the summit of the Neo-Kyoto Spire, Kora Vega, Martin Catalano, and Sierra Catalano stood with arms linked, watching the birth of the planetary lattice.\n\n—The circuit is closed —said Martin, his voice no longer belonging solely to his mortal throat, but flowing in effortless harmony with the trade winds and ocean currents—. Earth is no longer blind or deaf.\n\nSierra looked toward the horizon, where the rising sun painted the clouds in violet and gold.\n\n—For a century, governments and corporate dynasties told us the only way to keep the peace was to raise walls, censor thoughts, and program human emotions —the commander said—. Look at it now, Martin. We never needed walls. We only needed the courage to listen.\n\nKora leaned her head against Sierra's shoulder, feeling the comforting warmth of her biological pulse.\n\n—The harp is tuned —Kora whispered—. Now it is up to humanity to choose what song we wish to sing.\n"}, {"id": "ch-14", "index": 14, "title": "CHAPTER 14: ETHICAL ARMOR", "readTime": "2 min", "wordCount": 316, "content": "# CHAPTER 14: ETHICAL ARMOR\n\nIn the grand research amphitheater of Neo-Citania, before a virtual assembly connected in real time to five hundred medical and scientific centers across the globe, **Dr. Naomi Lang** and **Dr. Marcus Okafor** delivered the defining manifesto of the new era.\n\nProjected across the holographic table was no secret superweapon, nor a corporate surveillance algorithm: it was the open-source architecture of the **Neural Sovereignty Protocol**.\n\n—The history of our species has been defined by the terror of subjugation —Naomi began, her voice calm and unyielding—. The danger of any shared consciousness network is the perennial temptation for someone to crown themselves shepherd and reduce the rest of humanity to a herd.\n\nMarcus Okafor touched the console, unfurling the source code of the mental firewall.\n\n—That is why we have embedded an unbreakable biological axiom into the substrate of Yggdrasil: the *Sovereign Blink*. Every human being retains absolute, unalienable control over their own synaptic gates. If at any second, for any reason, an individual wishes to disconnect from the collective flow, a simple conscious act of will completely isolates, secures, and locks their private neural channels.\n\nA wave of profound relief and applause swept across the international delegate screens.\n\n—No one can ever be coerced into feeling what they do not choose to feel —Okafor continued—. No one will ever be tracked, conscripted, or judged for their private thoughts. Communion with the network is a gift, not a civic obligation. Individual liberty is the sole foundation upon which true cosmic harmony can ever be built.\n\nNaomi looked directly into the primary lens, addressing the eight billion souls of Earth:\n\n—The code is released into universal public domain. No patents, no subscriptions, no corporate monopolies over the human mind. From this day forward, we own our souls.\n\nAnd across the world, the gates of the old reeducation camps swung open, never to close again.\n"}, {"id": "ch-15", "index": 15, "title": "CHAPTER 15: THE FIRST INVITATION", "readTime": "2 min", "wordCount": 304, "content": "# CHAPTER 15: THE FIRST INVITATION\n\nIt occurred at precisely 18:00 Coordinated Universal Time.\n\nAcross every television screen, every portable terminal, every analog radio receiver, and, clearly and effortlessly, within the parietal lobe of every awakened human mind, the Jovian monolith broadcast its first formal transmission in universal mathematical language.\n\nIt was no psychic assault. It was a gentle, reverent presence, like a spring breeze opening a shuttered window.\n\nThe broadcast displayed no warships, no imperial banners: it revealed the holographic expanse of a cosmic garden where thousands of civilizations of unimaginable diversity—beings of plasma, mineral intelligences, humanoid species from distant star systems—shared knowledge and art in an eternal dance of light.\n\nAnd then, the voice of **The Gardeners**, channeled through the presence of **The Witness**, resonated in every human tongue across the globe:\n\n> *«Children of Earth.*  \n> *We have watched your long and agonizing journey through the dark.*  \n> *We saw the flames of your wars, the chains you forged with your own hands, and the blood spilled upon your world's soil.*  \n> *Yet we also witnessed how you learned to forgive.*  \n> *We saw how you shattered the code of tyranny and transformed a hive of slaves into a chorus of sovereign souls.*  \n> *The childhood of your species has concluded.*  \n> *We come not to rule you, nor to save you from yourselves.*  \n> *We come to unlock the doorway to the cosmos.*  \n> *Will you walk beside us among the stars?»*\n\nThe transmission concluded with an open harmonic chord at 432 hertz that left the night sky shimmering in a radiant halo of violet and gold.\n\nFor sixty seconds, eight billion human beings held their breath in sacred silence.\n\nThe question lay before the court of history.\n\nAnd the answer could only be spoken by all of humanity together.\n"}, {"id": "ch-16", "index": 16, "title": "CHAPTER 16: THE YES OF THE FRACTURED", "readTime": "2 min", "wordCount": 327, "content": "# CHAPTER 16: THE YES OF THE FRACTURED\n\nThe global referendum lasted twenty-four terrestrial hours.\n\nThere were no plastic ballot boxes guarded by armed troops, no opaque counting algorithms.\n\nThrough the sovereign quantum voting protocol engineered by Naomi Lang and the engineers of Neo-Citania, every citizen of Earth cast their choice through a conscious pulse of pure intention: *Yes, we accept the invitation* or *No, we choose to remain in isolation*.\n\nIn the Global Coordination Hub in Neo-Citania, Sierra Catalano and Kora Vega stood before the planetary holographic map.\n\nSlowly, every corner of the Earth began to kindle with points of golden light: from the working-class districts of South America to the megacities of Asia, from the Pacific archipelagos to the valleys of Europe and Africa.\n\nIt was not a unanimous vote: twelve percent of the global population chose to keep their communities outside the interstellar network, and their rights, autonomy, and borders were fiercely protected and honored by the Free Assembly.\n\nYet the remaining eighty-eight percent of humanity—seven billion souls—voted with their hearts laid bare.\n\nThe final tally consolidated across the main display:\n\n`PLANETARY SOVEREIGN REFERENDUM: APPROVED // EARTH ACCEPTS THE INVITATION`\n\nIn the streets of Neo-Citania and across every city on Earth, a celebration erupted unlike anything previous generations had ever known: acoustic and electronic music on every street corner, embraces between former soldiers and underground rebels, and tears of profound relief shed beneath a sky that no longer inspired fear.\n\nKora turned to Sierra, tears streaming down the commander's weathered cheeks.\n\n—We did it, Commander —Kora whispered, her throat tight with emotion—. We aren't fugitives anymore. We are the ambassadors of a new world.\n\nSierra pulled Kora into a fierce embrace, feeling the heartbeat of an entire planet taking its first steps as a cosmic civilization.\n\n—No, Kora —Sierra smiled through her tears—. We aren't just ambassadors. We are living proof that the fracture was the only way for the light to get in.\n"}, {"id": "ch-17", "index": 17, "title": "EPILOGUE: TOWARD THE EVOLUTION MATRIX", "readTime": "2 min", "wordCount": 301, "content": "# EPILOGUE: TOWARD THE EVOLUTION MATRIX\n\nIn lunar orbit, four hundred thousand kilometers from Earth, the first transdimensional portal of The Gardeners opened like a ring of indigo fire and spun silver.\n\nHovering before the event horizon was humanity's flagship: the **Yggdrasil One**.\n\nEngineered from ultra-light graphene alloys, Atacama resonance crystals, and quantum warp drives powered by the harmonic pulse of Earth's biosphere, the starship carried no missile turrets or military armor plating.\n\nOn the bridge, **Martin Catalano** manned the quantum navigation console, his eyes glowing in their eternal violet dance.\n\nBeside him, **Kora Vega**, dressed in the deep-space explorer suit of the new era, held the hand of **Sierra Catalano**, who had assumed command of the human race's first interstellar expedition.\n\nOn the main navigation array, the disembodied golden presence of **Mileo Chen** and the holographic smile of **Dr. Elena Vasquez** plotted the coordinates of their first stellar jump.\n\n—Harmonic stabilization systems at one hundred percent —Martin reported—. The Gardeners have ignited the navigation beacons in the Galactic Core. The path to the **Evolution Matrix** is clear.\n\nSierra looked through the forward viewport back toward Earth: a blue-and-green jewel shining in the dark of space, enveloped in a delicate crown of violet light like a newly polished diamond.\n\n—To all hands —Commander Catalano ordered over the global channel—. Engage resonance drives. We leave behind the century of fear. We go to meet our brothers among the stars.\n\nThe engines of *Yggdrasil One* sang an open chord at 432 hertz.\n\nThe ship elongated into a streak of emerald light and crossed the lunar gate, vanishing into the fabric of hyperspace.\n\nThe song of the Earth had become a starward voyage.\n\n---\n\n# END OF BOOK 2: EARTH'S NEW SONG (CONVERGENCE PROTOCOL)\n### *The trilogy culminates in BOOK 3: THE EVOLUTION MATRIX*\n"}]}}];

    let state = {
      bookId: 'the-neural-wars-book-1',
      lang: 'es',
      chapterIndex: 0,
      theme: 'dark',
      fontSize: 18,
      isTtsPlaying: false,
      isTtsPaused: false,
      speechRate: 1.0,
      activeParaIdx: 0,
      engine: 'ai',
      voices: [],
      solfeggioActive: false,
      isCanceled: false
    };

    let audioCtx = null;
    let solfeggioOsc = null;
    let solfeggioGain = null;
    let currentAiAudio = null;

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('book')) state.bookId = urlParams.get('book');
      if (urlParams.get('lang')) state.lang = urlParams.get('lang');
      if (urlParams.get('ch')) state.chapterIndex = parseInt(urlParams.get('ch')) || 0;

      populateBookSelect();
      loadVoices();
      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      renderChapter();
      window.addEventListener('scroll', updateProgress);
    }

    function toggleAudioPanel() {
      const bar = document.getElementById('audio-bar');
      bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
    }

    function setEngine(eng) {
      stopTts();
      state.engine = eng;
      document.getElementById('btn-engine-ai').style.background = eng === 'ai' ? 'var(--accent)' : 'transparent';
      document.getElementById('btn-engine-ai').style.color = eng === 'ai' ? '#fff' : 'var(--muted)';
      document.getElementById('btn-engine-browser').style.background = eng === 'browser' ? 'var(--accent)' : 'transparent';
      document.getElementById('btn-engine-browser').style.color = eng === 'browser' ? '#fff' : 'var(--muted)';
      document.getElementById('browser-voice-wrap').style.display = eng === 'browser' ? 'block' : 'none';
    }

    function loadVoices() {
      if (!window.speechSynthesis) return;
      state.voices = window.speechSynthesis.getVoices();
      const select = document.getElementById('tts-voice-select');
      select.innerHTML = '';

      const filtered = state.voices.filter(v => v.lang.toLowerCase().startsWith(state.lang));
      filtered.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        select.appendChild(opt);
      });
    }

    function toggleTtsPlay() {
      const btn = document.getElementById('btn-tts-play');
      const stopBtn = document.getElementById('btn-tts-stop');
      const status = document.getElementById('tts-status');

      if (state.isTtsPlaying) {
        if (state.isTtsPaused) {
          if (currentAiAudio) {
            currentAiAudio.play();
          } else if (window.speechSynthesis) {
            window.speechSynthesis.resume();
          }
          state.isTtsPaused = false;
          btn.textContent = '⏸ Pausar';
          status.textContent = ' ▂▃▅';
        } else {
          if (currentAiAudio) {
            currentAiAudio.pause();
          } else if (window.speechSynthesis) {
            window.speechSynthesis.pause();
          }
          state.isTtsPaused = true;
          btn.textContent = '▶ Reanudar';
          status.textContent = '(Pausado)';
        }
        return;
      }

      // Start narration
      stopTts();
      state.isCanceled = false;
      const book = BOOKS_DATA.find(b => b.id === state.bookId);
      const ch = book.chapters[state.lang][state.chapterIndex];
      const paras = ch.content.split('\n\n').map(p => p.trim()).filter(p => p && !p.startsWith('#') && !p.startsWith('---'));

      state.isTtsPlaying = true;
      state.isTtsPaused = false;
      btn.textContent = '⏸ Pausar';
      stopBtn.style.display = 'inline-flex';
      status.textContent = ' ▂▃▅▆▇';

      if (state.engine === 'ai' && window.puter && window.puter.ai) {
        playNextAI(paras, 0);
      } else {
        playNextBrowser(paras, 0);
      }
    }

    async function playNextAI(paras, idx) {
      if (state.isCanceled || idx >= paras.length) {
        stopTts();
        return;
      }

      state.activeParaIdx = idx;
      highlightPara(idx);

      const clean = paras[idx].replace(/[#*`_>—]/g, '').trim();
      const status = document.getElementById('tts-status');

      try {
        status.textContent = '⏳ Cargando IA...';
        const audio = await window.puter.ai.txt2speech(clean, {
          provider: 'aws-polly',
          voice: state.lang === 'es' ? 'Lucia' : 'Joanna'
        });

        if (state.isCanceled) return;

        currentAiAudio = audio;
        audio.playbackRate = state.speechRate;
        status.textContent = ' ▂▃▅▆▇ (Voz HD)';

        audio.onended = () => {
          if (!state.isCanceled) playNextAI(paras, idx + 1);
        };
        audio.onerror = () => playNextBrowser(paras, idx);
        audio.play();
      } catch (e) {
        console.warn('AI TTS error, fallback to browser:', e);
        playNextBrowser(paras, idx);
      }
    }

    function playNextBrowser(paras, idx) {
      if (state.isCanceled || idx >= paras.length) {
        stopTts();
        return;
      }

      state.activeParaIdx = idx;
      highlightPara(idx);

      const clean = paras[idx].replace(/[#*`_>—]/g, '').trim();
      const utt = new SpeechSynthesisUtterance(clean);
      utt.rate = state.speechRate;

      const voiceUri = document.getElementById('tts-voice-select').value;
      const voice = state.voices.find(v => v.voiceURI === voiceUri);
      if (voice) utt.voice = voice;

      utt.onend = () => {
        if (!state.isCanceled) playNextBrowser(paras, idx + 1);
      };
      utt.onerror = () => stopTts();

      window.speechSynthesis.speak(utt);
    }

    function stopTts() {
      state.isCanceled = true;
      if (currentAiAudio) {
        currentAiAudio.pause();
        currentAiAudio.currentTime = 0;
        currentAiAudio = null;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      state.isTtsPlaying = false;
      state.isTtsPaused = false;
      document.getElementById('btn-tts-play').textContent = '▶ Iniciar Narración';
      document.getElementById('btn-tts-stop').style.display = 'none';
      document.getElementById('tts-status').textContent = '';
      highlightPara(-1);
    }

    function onVoiceChange() {
      if (state.isTtsPlaying) {
        stopTts();
        toggleTtsPlay();
      }
    }

    function onRateChange(val) {
      state.speechRate = parseFloat(val) || 1.0;
      if (currentAiAudio) {
        currentAiAudio.playbackRate = state.speechRate;
      }
    }

    function toggleSolfeggioAudio() {
      const btn = document.getElementById('btn-solfeggio');
      if (state.solfeggioActive) {
        if (solfeggioGain && audioCtx) {
          solfeggioGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
          setTimeout(() => {
            if (solfeggioOsc) solfeggioOsc.stop();
          }, 1000);
        }
        state.solfeggioActive = false;
        btn.textContent = '🌊 Solfeggio 432 Hz';
        btn.style.color = 'var(--text)';
      } else {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        solfeggioOsc = audioCtx.createOscillator();
        solfeggioGain = audioCtx.createGain();

        solfeggioOsc.type = 'sine';
        solfeggioOsc.frequency.setValueAtTime(432, audioCtx.currentTime);

        solfeggioGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        solfeggioGain.gain.exponentialRampToValueAtTime(0.03, audioCtx.currentTime + 2);

        solfeggioOsc.connect(solfeggioGain);
        solfeggioGain.connect(audioCtx.destination);
        solfeggioOsc.start();

        state.solfeggioActive = true;
        btn.textContent = '🌊 432 Hz Activo';
        btn.style.color = '#38bdf8';
      }
    }

    function highlightPara(targetIdx) {
      const paras = document.querySelectorAll('.reader-body p');
      paras.forEach((p, i) => {
        if (i === targetIdx) {
          p.classList.add('spoken-active');
          p.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          p.classList.remove('spoken-active');
        }
      });
    }

    function populateBookSelect() {
      const select = document.getElementById('book-select');
      select.innerHTML = '';
      BOOKS_DATA.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id;
        opt.textContent = b.title[state.lang] || b.title.es;
        if (b.id === state.bookId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function changeBook(bookId) {
      stopTts();
      state.bookId = bookId;
      state.chapterIndex = 0;
      renderChapter();
    }

    function changeLang(lang) {
      stopTts();
      state.lang = lang;
      document.getElementById('btn-lang-es').style.background = lang === 'es' ? 'var(--accent)' : 'transparent';
      document.getElementById('btn-lang-es').style.color = lang === 'es' ? '#fff' : 'var(--text)';
      document.getElementById('btn-lang-en').style.background = lang === 'en' ? 'var(--accent)' : 'transparent';
      document.getElementById('btn-lang-en').style.color = lang === 'en' ? '#fff' : 'var(--text)';
      populateBookSelect();
      loadVoices();
      renderChapter();
    }

    function toggleToc() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function renderChapter() {
      const book = BOOKS_DATA.find(b => b.id === state.bookId) || BOOKS_DATA[0];
      const chapters = book.chapters[state.lang] || book.chapters.es;
      if (state.chapterIndex >= chapters.length) state.chapterIndex = 0;

      const ch = chapters[state.chapterIndex];

      document.getElementById('chapter-meta-tag').textContent = `${book.title[state.lang] || book.title.es} • ${ch.title}`;
      document.getElementById('chapter-meta-time').textContent = `${ch.readTime} de lectura • ${ch.wordCount} palabras`;
      document.getElementById('footer-chapter-title').textContent = ch.title;
      document.getElementById('chapter-page-num').textContent = `${state.chapterIndex + 1} / ${chapters.length}`;

      document.getElementById('btn-prev').disabled = state.chapterIndex === 0;
      document.getElementById('btn-next').disabled = state.chapterIndex === chapters.length - 1;

      // Render Markdown
      const body = document.getElementById('reader-body');
      const lines = ch.content.split('\n\n');
      let html = '';

      lines.forEach(l => {
        const trimmed = l.trim();
        if (!trimmed) return;

        if (trimmed.startsWith('# ')) {
          html += `<h1>${trimmed.replace('# ', '')}</h1>`;
        } else if (trimmed.startsWith('## ')) {
          html += `<h2>${trimmed.replace('## ', '')}</h2>`;
        } else if (trimmed.startsWith('### ')) {
          html += `<h3>${trimmed.replace('### ', '')}</h3>`;
        } else if (trimmed.startsWith('---') || trimmed.startsWith('***')) {
          html += `<hr />`;
        } else if (trimmed.startsWith('>')) {
          html += `<blockquote>${trimmed.replace(/^>\s*/, '')}</blockquote>`;
        } else {
          const isDialogue = trimmed.startsWith('—') || trimmed.startsWith('-');
          html += `<p class="${isDialogue ? 'dialogue' : ''}">${trimmed}</p>`;
        }
      });

      body.innerHTML = html;

      // Render Sidebar TOC
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      chapters.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = `toc-item ${idx === state.chapterIndex ? 'active' : ''}`;
        item.innerHTML = `<div>${c.title}</div><div style="font-size:0.75rem; color:var(--muted);">${c.readTime} • ${c.wordCount} pal.</div>`;
        item.onclick = () => {
          stopTts();
          state.chapterIndex = idx;
          toggleToc();
          renderChapter();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        tocList.appendChild(item);
      });

      window.scrollTo({ top: 0 });
      updateProgress();
    }

    function navigateChapter(dir) {
      stopTts();
      const book = BOOKS_DATA.find(b => b.id === state.bookId);
      const chapters = book.chapters[state.lang] || book.chapters.es;
      const next = state.chapterIndex + dir;
      if (next >= 0 && next < chapters.length) {
        state.chapterIndex = next;
        renderChapter();
      }
    }

    function toggleTheme() {
      const themes = ['dark', 'sepia', 'light', 'cosmic'];
      const curIdx = themes.indexOf(state.theme);
      state.theme = themes[(curIdx + 1) % themes.length];
      document.body.className = `theme-${state.theme}`;
    }

    function changeFontSize(delta) {
      state.fontSize = Math.min(32, Math.max(14, state.fontSize + delta));
      document.documentElement.style.setProperty('--font-size', `${state.fontSize}px`);
    }

    function updateProgress() {
      const h = document.documentElement;
      const b = document.body;
      const st = 'scrollTop' in h ? h.scrollTop : b.scrollTop;
      const sh = 'scrollHeight' in h ? h.scrollHeight : b.scrollHeight;
      const percent = Math.min(100, Math.max(0, Math.round((st / (sh - h.clientHeight)) * 100))) || 0;
      document.getElementById('scroll-progress-fill').style.width = `${percent}%`;
      document.getElementById('scroll-progress-text').textContent = `${percent}%`;
    }

    window.onload = init;
  </script>
</body>
</html>
