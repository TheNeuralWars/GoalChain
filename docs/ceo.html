<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente CEO • GoalChain</title>
    <link rel="icon" type="image/png" href="assets/img/logo_3d_clean.png">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #111116;
            --text: #e2e8f0;
            --dim: #94a3b8;
            --user: #3b82f6;
            --ceo: #1f1f2e;
            --border: #2a2a35;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }
        
        .header {
            position: sticky;
            top: 0;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 100;
        }
        
        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        
        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .title .icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .title h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .live {
            background: #22c55e;
            color: black;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            cursor: pointer;
        }
        
        .btn-discord {
            background: #5865F2;
            color: white;
        }
        
        .btn-copy {
            background: #1f1f2e;
            color: #e2e8f0;
            border: 1px solid #3a3a48;
        }
        
        .btn-refresh {
            background: #1f1f2e;
            color: #e2e8f0;
            border: 1px solid #3a3a48;
        }
        
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
        }
        
        .chat-window {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            display: flex;
            margin-bottom: 16px;
            max-width: 85%;
        }
        
        .message.ceo {
            justify-content: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
            margin-left: auto;
        }
        
        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.92rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message.ceo .bubble {
            background: var(--ceo);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-bottom-left-radius: 4px;
        }
        
        .message.user .bubble {
            background: var(--user);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .label {
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 4px;
            opacity: 0.7;
        }
        
        .message.user .label {
            text-align: right;
        }
        
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: var(--dim);
        }
        
        .footer a {
            color: #a78bfa;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }

        /* Big prominent button for sending instructions */
        .big-action-bar {
            background: #1a1a22;
            border: 1px solid #3a3a48;
            border-radius: 14px;
            padding: 12px 16px;
            margin: 12px 0 20px;
            text-align: center;
        }

        .big-instruction-btn {
            width: 100%;
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .big-instruction-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(167, 139, 250, 0.3);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: black;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="title">
                <div class="icon">🤖</div>
                <div>
                    <h1>Agente CEO</h1>
                    <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
                        <span class="live">LIVE</span>
                        <span style="font-size:0.7rem; color:#64748b;">GoalChain</span>
                    </div>
                </div>
            </div>
            
            <div class="actions">
                <a href="https://discord.com/channels/@me" target="_blank" class="btn btn-discord">💬 Discord</a>
                <button onclick="copyCommand()" class="btn btn-copy">📤 Copiar</button>
                <button onclick="refreshChat()" class="btn btn-refresh">↻</button>
            </div>
        </div>
    </div>

    <!-- Big prominent button for sending instructions to the bot -->
    <div style="max-width: 900px; margin: 0 auto; padding: 0 16px;">
        <div class="big-action-bar">
            <button onclick="copyInstructionToBot()" class="big-instruction-btn">
                📤 <span>Enviar instrucción al bot (copiar "panel")</span>
            </button>
            <div style="font-size: 0.72rem; color: #64748b; margin-top: 8px;">
                Copia "panel" → Pégalo en Discord para que el @GoalChain Manager te muestre los botones de acciones rápidas
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div id="chatWindow" class="chat-window">
            <div id="messages"></div>
            <div id="loading" class="empty">Cargando conversación...</div>
        </div>
    </div>

    <div class="footer">
        Fuente: ceo-log.txt (actualizado desde el repo) • <a href="https://github.com/TheNeuralWars/GoalChain/blob/main/Talks/Grok-CEO.md" target="_blank">Ver en GitHub</a>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script>
        let lastContent = '';

        async function loadChat() {
            const container = document.getElementById('messages');
            const loading = document.getElementById('loading');
            
            try {
                const res = await fetch('./ceo-log.txt', { cache: 'no-store' });
                const text = await res.text();

                if (text === lastContent) return;
                lastContent = text;

                loading.style.display = 'none';
                container.innerHTML = '';

                // More flexible parsing - split on --- or on timestamp headers
                let blocks = text.split('---');
                if (blocks.length < 3) {
                    blocks = text.split(/### 🕒/);
                }

                const entries = blocks.filter(e => e.trim().length > 80);

                let rendered = 0;

                entries.forEach(entry => {
                    // Try multiple patterns for user messages
                    let userText = null;
                    const userPatterns = [
                        /\*\*Usuario \(Nicolás\):\*\*\s*([\s\S]*?)(?=\*\*Agente CEO|\*\*Respuesta Agente CEO|\*\*Resumen|$)/i,
                        /\*\*Usuario:\*\*\s*([\s\S]*?)(?=\*\*Agente CEO|\*\*Respuesta Agente CEO|\*\*Resumen|$)/i,
                        /\*\*Nico.*?:\*\*\s*([\s\S]*?)(?=\*\*Agente CEO|\*\*Respuesta Agente CEO|\*\*Resumen|$)/i
                    ];
                    for (const pattern of userPatterns) {
                        const m = entry.match(pattern);
                        if (m && m[1] && m[1].trim().length > 10) {
                            userText = m[1].trim();
                            break;
                        }
                    }

                    // Try multiple patterns for CEO responses
                    let ceoText = null;
                    const ceoPatterns = [
                        /\*\*Agente CEO:\*\*\s*([\s\S]*?)(?=\*\*Resumen Ejecutivo|\*\*Resumen|$)/i,
                        /\*\*Respuesta Agente CEO:\*\*\s*([\s\S]*?)(?=\*\*Resumen Ejecutivo|\*\*Resumen|$)/i,
                        /\*\*Agente CEO \(Respuesta completa\):\*\*\s*([\s\S]*?)(?=\*\*Resumen|$)/i
                    ];
                    for (const pattern of ceoPatterns) {
                        const m = entry.match(pattern);
                        if (m && m[1] && m[1].trim().length > 15) {
                            ceoText = m[1].trim();
                            break;
                        }
                    }

                    if (userText) {
                        addMessage(container, 'user', 'Nicolás', userText);
                        rendered++;
                    }
                    if (ceoText) {
                        addMessage(container, 'ceo', 'Agente CEO', ceoText);
                        rendered++;
                    }
                });

                // Strong fallback: always show the last substantial chunk of the file if we couldn't parse structured messages
                if (rendered === 0 && text.length > 400) {
                    // Take the last ~4000 characters and show them cleanly
                    let lastChunk = text.trim().slice(-4200);
                    // Try to start from a reasonable point (after a timestamp if possible)
                    const lastTimestamp = lastChunk.lastIndexOf('### 🕒');
                    if (lastTimestamp > 100) {
                        lastChunk = lastChunk.substring(lastTimestamp);
                    }

                    const fallback = document.createElement('div');
                    fallback.style.cssText = 'background:#1a1a22; padding:18px; border-radius:14px; border:1px solid #3a3a48; font-size:0.92rem; white-space:pre-wrap; line-height:1.55; max-height:70vh; overflow:auto;';
                    fallback.textContent = lastChunk;
                    container.appendChild(fallback);
                    rendered = 1;
                }

                // Always force scroll to the very bottom so the latest content is visible
                const chatWindow = document.getElementById('chatWindow');
                setTimeout(() => {
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 80);

            } catch (e) {
                loading.innerHTML = 'Error cargando el log.<br>Intenta refrescar.';
            }
        }

        function addMessage(container, type, label, text) {
            const div = document.createElement('div');
            div.className = `message ${type}`;

            const safe = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');

            div.innerHTML = `
                <div style="display:flex; flex-direction:column; width:100%;">
                    <div class="label">${label}</div>
                    <div class="bubble">${safe}</div>
                </div>
            `;
            container.appendChild(div);
        }

        function refreshChat() {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            document.getElementById('loading').style.display = 'block';
            lastContent = '';
            loadChat();
        }

        function copyCommand() {
            const cmd = "Agente CEO: [Escribe tu instrucción aquí]";
            navigator.clipboard.writeText(cmd).then(() => {
                const btns = document.querySelectorAll('.btn-copy');
                if (btns.length) {
                    const original = btns[0].innerText;
                    btns[0].innerText = '¡Copiado!';
                    setTimeout(() => btns[0].innerText = original, 1200);
                }
            });
        }

        function copyInstructionToBot() {
            // Copia el comando que hace que el @GoalChain Manager muestre el panel de acciones rápidas (incluyendo las del CEO Log)
            const command = "panel";
            navigator.clipboard.writeText(command).then(() => {
                showToast("✅ Copiado 'panel'. Pégalo en Discord para ver los botones del Manager.");
            }).catch(() => {
                prompt("Copia este comando y pégalo en Discord:", command);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2400);
        }

        // Cargar al inicio
        loadChat();

        // Actualizar cada 12 segundos
        setInterval(() => {
            loadChat();
        }, 12000);
    </script>
</body>
</html>
