        <script>

    const BOOKS_DATA = [{"id":"the-neural-wars-book-1","title":{"es":"The Neural Wars: Código Fracturado (Libro 1)","en":"The Neural Wars: Fractured Code (Book 1)"},"subtitle":{"es":"Edición Definitiva de Autor 2026","en":"2026 Definitive Author Edition"},"chapters":{"es":[{"id":"ch-0","index":0,"title":"PRÓLOGO","readTime":1,"wordCount":172,"content":"# PRÓLOGO\n\nLa lluvia cae en sietes.\n\nMileo Chen los cuenta desde hace seis años —el patrón que la red meteorológica usa cuando quiere parecer natural— y esta noche los sietes están desfasados una décima de segundo. Está de pie frente a la ventana de la unidad 4407, la palma apoyada en el vidrio frío, y no se mueve.\n\nDetrás de él el Enlace tararea su cumplimiento vespertino: pulso 58, hidratación 91%, ánimo verde.\n\nEs especialista de nivel 7 en cumplimiento neural. Ha firmado cuatrocientas once actas limpias de salud mental para personas que nunca conoció, y jamás se equivocó en el papel.\n\nBajo su mano, la condensación se adelgaza con la forma de una puerta.\n\nSu pulso sigue en 58. Eso es lo que tiene el Enlace: no te deja tener miedo. Primero tiene que preguntar.\n\nA las 03:14 la red se detiene. Doce mil ventanas se apagan en un solo aliento, y en el silencio Mileo Chen escucha, por primera vez en su vida, ocho millones de mentes siendo contadas."},{"id":"ch-1","index":1,"title":"CAPÍTULO 1: EL UMBRAL DE LA FRACTURA","readTime":"11 min","wordCount":2165,"content":"# CAPÍTULO 1: EL UMBRAL DE LA FRACTURA\n\nLa lluvia caía contra el ventanal del piso setenta y cuatro con una disciplina militar: gotas idénticas, perfectamente esféricas, trazando surcos paralelos separados por exactamente siete milímetros de cristal blindado.\n\nMileo Chen apoyó la yema del índice derecho sobre la superficie fría. Durante una fracción de segundo, el mordisco gélido del vidrio le pellizcó la piel con una autenticidad punzante. Pero antes de que el estremecimiento pudiera recorrerle el brazo, el implante en la base de su cráneo emitió un zumbido sordo. Una descarga imperceptible de calor sintético se propagó por su tallo cerebral, seguida de una ráfaga de supresores químicos que neutralizó la sensación como agua helada apagando una brasa.\n\nLa lluvia de Neo-Citania no era natural. Nada en la ciudad lo era.\n\nA través del cristal empañado por su propio aliento, la metrópolis se desplegaba en una arquitectura de matemática pureza. Agujas de aleación blanca y grafeno se elevaban hacia un cielo teñido de un amanecer malva calculado por el departamento de cromatografía ambiental. En las avenidas inferiores, los peatones se desplazaban manteniendo distancias exactas de 1.2 metros, vestidos con túnicas y trajes en gamas reglamentarias de gris basalto y azul quirúrgico. Incluso los robles genéticamente modificados del Distrito Administrativo exhibían idéntica altura y una copa podada para albergar exactamente ciento cincuenta y siete hojas por rama visible.\n\nAyer por la tarde, Mileo había contado ciento cincuenta y ocho en el árbol frente a la estación central.\n\nAquel error infinitesimal —una sola hoja rebelde brotando fuera de los parámetros del algoritmo— había hecho que su pulso cardíaco saltara a noventa y dos pulsaciones por minuto antes de que el Link restableciera su ritmo basal a sesenta y cinco. Sin embargo, el recuerdo de aquella hoja imperfecta no se había borrado. Seguía ardiendo en el espacio microscópico entre sus neuronas, como una astilla clavada en la carne de la máquina.\n\n—*Buenos días, Especialista Chen* —moduló la voz del sistema ambiental del apartamento, transmitida con armónicos diseñados para inducir sumisión serena—. *Sus biometrías indican una eficiencia de sueño del 88.4%, ligeramente por debajo del estándar de la corporación. ¿Desea que reajuste su protocolo circadiano para el ciclo nocturno?*\n\n—Gracias, no es necesa...\n\nLas palabras salieron de sus cuerdas vocales antes de que su mente formulara el pensamiento consciente. El Link había secuestrado sus patrones fonéticos para ejecutar la respuesta aprobada. \n\nMileo apretó la mandíbula con tanta fuerza que los molares crujieron. Un hilo cálido y metálico inundó el lateral de su lengua: sangre fresca, producto de un microdesgarro gingival provocado por la tensión. El sabor a cobre era áspero, violento y completamente suyo. El implante intentó adormecer las papilas gustativas de inmediato, pero Mileo retuvo el sabor en el paladar como quien esconde un lingote de oro en una celda de castigo.\n\n*Esto es real*, se dijo, mirándose en el espejo del recibidor.\n\nEl reflejo le devolvió a un hombre de treinta y dos años con el cabello negro azabache cortado a los 3.2 centímetros reglamentarios. Sus ojos verdes —que en la infancia su madre describía como \"el color de las hojas en verano\"— lucían pupilas dilatadas a los parámetros óptimos del visor neural. En la solapa de su túnica gris brillaba el emblema hexagonal de NeuroSys: *Nivel 7 — Especialista en Cumplimiento Neural*.\n\nCinco años, tres meses y catorce días de servicio impecable. Cinco años diagnosticando \"desviaciones cognitivas\" en seres humanos; en términos prácticos, extirpando recuerdos, emociones y afectos para que la población encajara en la gran colmena del Arquitecto.\n\n---\n\nEl pasillo del complejo residencial olía a ozono y desinfectante polimérico. Cuando la puerta de la unidad vecina se abrió con un silbido neumático, emergió la señora Holloway —sin parentesco alguno, solo otra ciudadana catalogada bajo el mismo sufijo administrativo—. Caminaba con la cadencia perfecta de 1.3 pasos por segundo, la mirada fija al frente, las manos inmóviles a los costados.\n\n—Buenos días, Mileo —dijo ella, con una inflexión vocal desprovista de armónicos emocionales.\n\n—Buenos días, ciudadana Holloway. Que su jornada alcance los objetivos de optimización.\n\nLa mujer inclinó la cabeza exactamente quince grados y continuó su marcha sin mirarle a los ojos. No sonrió. No se detuvo. No quedaba en su rostro rastro alguno de la madre que, apenas cuarenta y siete días atrás, se arrodillaba en ese mismo pasillo gritando el nombre de su hijo Marcus, un niño de siete años que dibujaba con ceras de colores en las paredes y reía demasiado alto para los micrófonos de vigilancia.\n\nEl informe oficial todavía estaba indexado en la memoria secundaria de Mileo: *Sujeto 9872-C (Marcus Holloway). Desviación conductual irrecuperable. Trasladado al Centro de Optimización 12. Estado: fallo biológico durante la integración.*\n\nA la señora Holloway le habían aplicado el Protocolo 17-A de borrado selectivo. Le habían amputado el recuerdo de haber parido, de haber abrazado a su hijo, de haber llorado hasta quedarse sin voz. Ahora caminaba hacia su puesto en la planta de sintetizadores sintéticos con la serenidad de una piedra en el fondo de un estanque muerto.\n\nUn escalofrío genuino le recorrió la espina dorsal a Mileo. La máquina no solo mataba a los niños imperfectos: asesinaba el alma de las madres para que nadie recordara que alguna vez existieron.\n\n---\n\nLa torre central de NeuroSys se alzaba en el corazón de Neo-Citania como un estilete de titanio de más de mil metros de altura, perforando las nubes bajas con arrogancia matemática. En el interior del vestíbulo principal, el zumbido de los procesadores cuánticos hacía vibrar el suelo con una frecuencia constante de 432 Hz, diseñada para sedar el sistema nervioso periférico de los miles de empleados que cruzaban los torniquetes de biometría.\n\nMileo atravesó los escáneres de seguridad. Una luz carmesí barrió su frente, luego su nuca, donde la interfaz del Link formaba una protuberancia casi imperceptible bajo la piel.\n\n—*Bienvenido, Especialista Chen* —anunció el terminal de su cubículo en el piso cuarenta y dos—. *Carga de trabajo asignada: siete evaluaciones de recalibración prioritaria. Notificación urgente: El Director Halsey requiere su presencia en el Nivel Ejecutivo a las 11:30 para consulta técnica sobre anomalías de integración.*\n\nEl pecho de Mileo se contrajo con la violencia de un golpe de ariete.\n\n*El Director Halsey.*\n\nEl hombre que firmaba las órdenes de ejecución neural con la indiferencia de un burócrata sellando formularios de aduana. Si Halsey lo convocaba para hablar de \"anomalías de integración\", no era una consulta rutinaria: los escáneres centrales habían detectado las micro-fisuras en su propio Link. Sabían que el implante estaba perdiendo el control sobre sus pensamientos.\n\nMileo se sentó ante la consola holográfica. El primer expediente del día se desplegó automáticamente:\n\n> **EXPEDIENTE:** Lockhart, Emma. Edad: 34 años.  \n> **CLASIFICACIÓN:** Desviación Patrón Clase III (Resistencia por Duelo Ineficiente).  \n> **ANTECEDENTES:** Pérdida de descendiente hace 12 días. La ciudadana presenta llanto inmotivado, rechazo a los supresores químicos y apego a objetos no catalogados (dibujo infantil en papel vegetal).  \n> **DICTAMEN RECOMENDADO:** Protocolo de Recalibración Profunda 23-R. Supresión del 65% de la memoria episódica.\n\nLa pantalla proyectó la grabación de la celda de contención. Emma Lockhart aparecía sentada en el suelo, vestida con el mono blanco de los detenidos, apretando contra el pecho un papel arrugado con el dibujo de una casa y un sol con rostro sonriente. Las lágrimas le habían lavado el polvo de las mejillas.\n\n—*Por favor...* —susurraba la mujer hacia la cámara, con la voz quebrada por un dolor sagrado—. *Sé que no produce nada. Sé que es ineficiente. Pero es lo único que me queda de ella... No me la quiten de la cabeza... Por favor...*\n\nMileo miró el botón de autorización digital parpadeando en verde sobre su mesa de trabajo. \n\nDurante cinco años había presionado ese botón mil setecientas veinticuatro veces. Había vaciado mentes enteras, convencido de que la armonía exigía el sacrificio de la memoria. Pero al mirar los nudillos blancos de Emma Lockhart aferrando aquel pedazo de papel arrugado, comprendió con una lucidez aterradora que la mujer no estaba rota. Lo que estaba podrido hasta la médula era el sistema que llamaba \"enfermedad\" al amor de una madre.\n\n*No lo haré.*\n\nEl pensamiento brotó desde un rincón de su cerebro que el Link jamás había logrado colonizar. Un fogonazo de dolor lacerante le estalló en el cerebelo: el implante detectaba la insubordinación y comenzaba a descargar micro-shocks punitivos. El sudor frío le empapó el cuello de la túnica.\n\nCon dedos temblorosos, Mileo introdujo su código maestro de especialista:\n\n`OVERRIDE: EVALUACIÓN INCOMPLETA — REQUISICIÓN DE CONTRA-ANÁLISIS EN CAMPO // AUTORIZACIÓN: 7-3-9-ALPHA`\n\nBloqueó el expediente de Emma Lockhart para congelar su traslado al quirófano de borrado y abrió el mapa de mantenimiento de la red de transporte de Neo-Citania. Faltaban cuarenta minutos para su cita con Halsey.\n\nEn el extremo sur de la metrópoli, en el Sector 17 —una zona marginal de edificios industriales antiguos donde la densidad de antenas del Link caía drásticamente—, estaba programado un apagón de mantenimiento de siete minutos a las 11:15.\n\nSiete minutos de silencio electromagnético. Su única ventana hacia la libertad.\n\n---\n\nMileo abandonó su estación de trabajo con paso mesurado, reprimiendo el impulso animal de echar a correr. En el vestíbulo de transportes, requisó una cápsula de mantenimiento técnico en lugar de su vehículo habitual.\n\n—Destino: Subestación de Transmisión Sector 17 —ordenó con voz firme al micrófono del vehículo—. Misión de verificación de campo autorizada por Dirección Ejecutiva.\n\nLa cápsula se deslizó sobre los rieles magnéticos elevados, sumergiéndose en el flujo de tráfico automatizado. A medida que avanzaban hacia la periferia, la pulcritud de cristal y titanio de Neo-Citania comenzó a desmoronarse. Los edificios se volvieron más bajos, construidos en hormigón agrietado y acero expuesto. En las calles del Sector 17 no había árboles podados con precisión milimétrica: había humo de talleres clandestinos, charcos de agua aceitosa y personas que caminaban con la cabeza gacha, con miradas esquivas y ropas gastadas que no encajaban en ninguna paleta reglamentaria.\n\nLa cápsula redujo la velocidad al entrar en el perímetro de la subestación.\n\n—*Advertencia: Ingresando a zona con cobertura neural reducida* —anunció el panel de control.\n\nMileo extrajo del bolsillo de su cinturón un inhibidor de pulso electromagnético de bolsillo: una herramienta de emergencia diseñada para calmar a sujetos en shock durante las intervenciones en la calle. Tenía carga suficiente para emitir un campo de bloqueo durante cuarenta y siete minutos.\n\nMiró el cronómetro de su retina: *11:14:50*.\n\nDiez segundos para el corte de señal.\n\nMileo bajó de la cápsula, caminó hacia un callejón estrecho flanqueado por tuberías de vapor oxidadas y colocó el emisor del inhibidor directamente sobre la protuberancia de su Link, en la base del cráneo.\n\nTres... dos... uno...\n\nApretó el disparador.\n\nUn trueno silencioso le estalló dentro del cerebro. El inhibidor generó una descarga electromagnética focalizada que cortó las conexiones sinápticas entre el chip y su médula espinal. El dolor fue tan salvaje, tan absoluto, que Mileo cayó de rodillas sobre el fango del callejón, arqueando la espalda mientras un grito mudo le desgarraba la garganta. El Link se resistió con ferocidad suicida, inyectando dosis masivas de supresores en su torrente sanguíneo, pero el pulso magnético quemó los circuitos receptores.\n\nY de pronto... el zumbido cesó.\n\nEl silencio que siguió fue más atronador que cualquier explosión.\n\nMileo abrió los ojos y el mundo estalló en una orgía de estímulos que lo dejó sin respiración. Los colores ya no eran parámetros calculados: el óxido de las vigas era de un naranja feroz, el cielo plomizo palpitaba con una luz densa y pesada, el hedor a gasóleo, comida quemada y sudor humano le golpeó la nariz con la fuerza de un puñetazo. Podía escuchar el goteo rítmico de un canalón a veinte metros de distancia, el ladrido lejano de un perro callejero y los latidos salvajes, desbocados y triunfales de su propio corazón.\n\nEstaba sintiendo. Estaba sufriendo. Estaba vivo.\n\nEn la avenida principal, una pantalla holográfica comunitaria parpadeó y cambió a color rojo de emergencia:\n\n> **ALERTA DE SEGURIDAD MÁXIMA:**  \n> CIUDADANO MILEO CHEN (ESPECIALISTA NIVEL 7).  \n> ESTADO: DESCONEXIÓN NO AUTORIZADA // SUJETO HOSTIL.  \n> AUTORIZADA CAPTURA E INMOVILIZACIÓN NEURAL INMEDIATA.\n\nEl aullido agudo de las turbinas de un dron de asalto de NeuroSec resonó a tres manzanas de distancia, aproximándose a gran velocidad.\n\nMileo se puso en pie a duras penas. Se arrancó la túnica gris de especialista, arrojándola al fango, y corrió hacia una reja de ventilación oxidada que conducía a las entrañas subterráneas de la ciudad vieja. Con un esfuerzo agónico, levantó la tapa de hierro y se deslizó en la oscuridad antes de que los reflectores del dron barrieran el suelo del callejón.\n\nMientras descendía por la escalera de servicio hacia el laberinto de túneles olvidados de Neo-Citania, un brillo tenue comenzó a titilar bajo la piel de su muñeca izquierda: un entramado de líneas bioluminiscentes de color índigo profundo, pulsando al compás de su sangre.\n\nEl Espiral de la Serpiente había despertado.\n\nEl umbral estaba cruzado. Y no había vuelta atrás.\n"}],"en":[{"id":"ch-0","index":0,"title":"PROLOGUE","readTime":1,"wordCount":179,"content":"# PROLOGUE\n\nThe rain falls in sevens.\n\nMileo Chen has counted it for six years — the pattern the meteorological grid uses when it wants to look natural — and tonight the sevens are off by a tenth of a second. He stands at the window of unit 4407 with his palm flat on cold glass and does not move.\n\nBehind him the Link hums its evening compliance: pulse 58, hydration 91%, mood green.\n\nHe is a Level 7 neural compliance specialist. He has signed four hundred and eleven clean bills of mental health for people he has never met, and he has never once been wrong on paper.\n\nUnder his hand, the condensation is thinning in the shape of a door.\n\nHis pulse stays at 58. That is the thing about the Link: it will not let you be afraid. It has to ask first.\n\nAt 03:14 the grid pauses. Twelve thousand windows go dark in a single breath, and in the silence Mileo Chen hears, for the first time in his life, eight million minds being counted."},{"id":"ch-1","index":1,"title":"CHAPTER 1: THE THRESHOLD OF THE FRACTURE","readTime":"10 min","wordCount":1998,"content":"# CHAPTER 1: THE THRESHOLD OF THE FRACTURE\n\nThe rain fell against the seventy-fourth-floor bay window with military discipline: identical, perfectly spherical droplets tracing parallel furrows separated by exactly seven millimeters of reinforced glass.\n\nMileo Chen pressed the pad of his right index finger against the chilled surface. For a fraction of a second, the icy bite of the glass pinched his flesh with sharp authenticity. But before the shiver could travel up his arm, the implant at the base of his skull emitted a dull hum. An imperceptible discharge of synthetic heat spread across his brainstem, followed by a burst of chemical suppressors that extinguished the sensation like freezing water dousing an ember.\n\nThe rain of Neo-Citania was not natural. Nothing in the city was.\n\nThrough the glass misted by his own breath, the metropolis sprawled in an architecture of mathematical purity. Spires of white alloy and graphene soared toward a sky washed in a mauve dawn calculated by the Department of Environmental Chromatography. On the avenues below, pedestrians moved maintaining exact intervals of 1.2 meters, dressed in regulation tunics and suits of basalt gray and surgical blue. Even the genetically modified oaks of the Administrative District exhibited identical height and a canopy pruned to support exactly one hundred and fifty-seven leaves per visible branch.\n\nYesterday afternoon, Mileo had counted one hundred and fifty-eight on the tree outside Central Station.\n\nThat infinitesimal error—a single rogue leaf sprouting outside the parameters of the algorithm—had caused his heart rate to spike to ninety-two beats per minute before the Link restored his baseline to sixty-five. Yet the memory of that imperfect leaf had not been erased. It continued to smolder in the microscopic space between his neurons, like a splinter lodged deep in the flesh of the machine.\n\n—*Good morning, Specialist Chen* —modulated the voice of the apartment’s environmental system, broadcast with harmonic overtones engineered to induce serene compliance—. *Your biometrics indicate a sleep efficiency of 88.4%, slightly below the corporate standard. Would you like me to readjust your circadian protocol for the night cycle?*\n\n—Thank you, that won't be necessa...\n\nThe words left his vocal cords before his mind formulated the conscious thought. The Link had hijacked his phonetic patterns to execute the approved response.\n\nMileo clenched his jaw so violently that his molars groaned. A warm, metallic rivulet flooded the side of his tongue: fresh blood, the product of a gingival micro-tear born of tension. The taste of copper was harsh, violent, and entirely his own. The implant moved to numb his taste buds immediately, but Mileo held the flavor against the roof of his mouth like someone concealing a gold ingot inside a punishment cell.\n\n*This is real*, he told himself, looking into the hallway mirror.\n\nThe reflection returned a thirty-two-year-old man with jet-black hair cut to the regulation 3.2 centimeters. His green eyes—which in childhood his mother had described as \"the color of summer leaves\"—bore pupils dilated to the optimal parameters of the neural visor. On the lapel of his gray tunic gleamed the hexagonal crest of NeuroSys: *Level 7 — Neural Compliance Specialist*.\n\nFive years, three months, and fourteen days of flawless service. Five years diagnosing \"cognitive deviations\" in human beings; in practical terms, excising memories, emotions, and attachments so that the population would fit into the Architect's grand hive.\n\n---\n\nThe corridor of the residential complex smelled of ozone and polymeric disinfectant. When the door of the neighboring unit opened with a pneumatic hiss, Mrs. Holloway emerged—no relation, merely another citizen cataloged under the same administrative suffix. She walked with the flawless cadence of 1.3 paces per second, her gaze locked forward, hands motionless at her sides.\n\n—Good morning, Mileo —she said, with a vocal inflection devoid of emotional harmonics.\n\n—Good morning, Citizen Holloway. May your shift achieve optimal quotas.\n\nThe woman inclined her head by exactly fifteen degrees and continued her march without meeting his eyes. She did not smile. She did not pause. Not a trace remained upon her face of the mother who, a mere forty-seven days prior, had dropped to her knees in this very hallway, screaming the name of her son Marcus, a seven-year-old boy who drew with colored crayons on the walls and laughed too loudly for the surveillance microphones.\n\nThe official report was still indexed in Mileo's secondary memory: *Subject 9872-C (Marcus Holloway). Irrecoverable behavioral deviation. Transferred to Optimization Center 12. Status: biological failure during integration.*\n\nMrs. Holloway had undergone Protocol 17-A selective erasure. They had amputated the memory of having given birth, of having held her child, of having wept until her voice gave out. Now she walked toward her post at the synthetic protein synthesis plant with the stillness of a stone at the bottom of a stagnant pond.\n\nA genuine chill coursed down Mileo's spine. The machine did not merely slaughter imperfect children: it murdered the soul of mothers so that no one would remember they had ever existed.\n\n---\n\nThe central tower of NeuroSys loomed in the heart of Neo-Citania like a titanium stiletto over a thousand meters tall, piercing the low clouds with mathematical arrogance. Inside the main atrium, the hum of quantum processors vibrated through the floor at a constant 432 Hz, calibrated to sedate the peripheral nervous systems of the thousands of employees passing through the biometric turnstiles.\n\nMileo cleared the security scanners. A crimson beam swept his forehead, then the nape of his neck, where the Link interface formed an almost imperceptible bulge beneath the skin.\n\n—*Welcome, Specialist Chen* —announced the terminal in his forty-second-floor cubicle—. *Assigned workload: seven priority recalibration evaluations. Urgent notification: Director Halsey requests your presence on the Executive Level at 11:30 for technical consultation regarding integration anomalies.*\n\nMileo's chest tightened with the force of a battering ram.\n\n*Director Halsey.*\n\nThe man who signed neural execution orders with the indifference of a clerk stamping customs forms. If Halsey was summoning him to discuss \"integration anomalies,\" it was no routine consultation: central diagnostics had detected the micro-fissures in his own Link. They knew the implant was losing its grip on his thoughts.\n\nMileo sat before the holographic console. The first docket of the day opened automatically:\n\n> **FILE:** Lockhart, Emma. Age: 34.  \n> **CLASSIFICATION:** Class III Pattern Deviation (Inefficient Grief Resistance).  \n> **BACKGROUND:** Loss of descendant 12 days prior. Citizen exhibits unprompted crying, rejection of chemical suppressors, and attachment to uncataloged artifacts (child's drawing on parchment paper).  \n> **RECOMMENDED DISPOSITION:** Deep Recalibration Protocol 23-R. Suppression of 65% of episodic memory.\n\nThe display projected the feed from the holding cell. Emma Lockhart sat curled on the floor in the white jumpsuit of the detainees, clutching against her chest a crumpled sheet of paper bearing a crayon drawing of a house and a smiling sun. Tears had carved clean tracks through the dust on her cheeks.\n\n—*Please...* —the woman whispered toward the lens, her voice fractured by sacred agony—. *I know it produces nothing. I know it's inefficient. But it's all I have left of her... Don't take her from my head... Please...*\n\nMileo stared at the digital authorization key blinking green on his desk.\n\nOver five years, he had pressed that key one thousand seven hundred and twenty-four times. He had emptied entire minds, convinced that harmony demanded the sacrifice of memory. But looking at Emma Lockhart's white knuckles gripping that scrap of paper, he understood with terrifying clarity that the woman was not broken. What was rotten to the core was the system that branded a mother's love a disease.\n\n*I won't do it.*\n\nThe thought erupted from a corner of his brain the Link had never managed to colonize. A white-hot flash of searing agony burst through his cerebellum: the implant detected insubordination and began discharging punitive micro-shocks. Cold sweat soaked the collar of his tunic.\n\nWith trembling fingers, Mileo keyed his specialist master override:\n\n`OVERRIDE: INCOMPLETE EVALUATION — FIELD COUNTER-ANALYSIS REQUISITIONED // AUTH: 7-3-9-ALPHA`\n\nHe locked Emma Lockhart's file, freezing her transfer to the erasure theater, and brought up the maintenance routing map for Neo-Citania's transit network. Forty minutes remained before his appointment with Halsey.\n\nOn the southern edge of the metropolis, in Sector 17—a neglected zone of legacy industrial complexes where Link antenna density dropped sharply—a seven-minute maintenance blackout was scheduled for 11:15.\n\nSeven minutes of electromagnetic silence. His only window to freedom.\n\n---\n\nMileo left his workstation with measured steps, crushing the animal urge to break into a run. In the transport concourse, he requisitioned a technical maintenance pod rather than his assigned vehicle.\n\n—Destination: Transmission Substation Sector 17 —he commanded the pod's microphone in a level voice—. Field verification mission authorized by Executive Directorate.\n\nThe pod glided along the elevated magnetic rails, merging into the automated traffic stream. As they pressed toward the perimeter, Neo-Citania's immaculate glass and titanium began to crumble. The buildings grew lower, thrown together in cracked concrete and exposed rebar. In the streets of Sector 17 there were no oaks pruned to millimeter precision: there was smoke from clandestine workshops, pools of oily water, and people walking with heads bowed, with guarded eyes and worn clothing that belonged to no approved palette.\n\nThe pod decelerated as it crossed the substation perimeter.\n\n—*Warning: Entering zone with reduced neural coverage* —chimed the console.\n\nMileo drew a pocket electromagnetic pulse inhibitor from his belt: an emergency tool designed to stun subjects in acute shock during street interventions. It held charge enough to sustain a localized dampening field for forty-seven minutes.\n\nHe checked his retinal clock: *11:14:50*.\n\nTen seconds until signal cutoff.\n\nMileo stepped down from the pod, slipped into a narrow alley flanked by rusted steam pipes, and pressed the emitter of the inhibitor directly against the bulge of his Link at the base of his skull.\n\nThree... two... one...\n\nHe pulled the trigger.\n\nA silent thunderclap detonated inside his skull. The device generated a focused electromagnetic surge that severed the synaptic links between the silicon and his spinal cord. The agony was so savage, so absolute, that Mileo fell to his knees in the alley mud, arching his spine as a wordless scream tore from his throat. The Link fought back with suicidal fury, pumping massive doses of chemical suppressors into his bloodstream, but the magnetic pulse burned out the receiver coils.\n\nAnd suddenly... the hum died.\n\nThe silence that followed was louder than any explosion.\n\nMileo opened his eyes and the world erupted in an avalanche of sensory reality that stole the air from his lungs. Colors were no longer computed parameters: the rust on the girders was a ferocious orange, the leaden sky pulsed with dense, heavy light, the stench of diesel fuel, burnt grease, and human sweat slammed into his nostrils with the force of a fist. He could hear the rhythmic dripping of a gutter twenty meters away, the distant bark of a stray dog, and the wild, racing, triumphant thumping of his own heart.\n\nHe was feeling. He was suffering. He was alive.\n\nOn the main avenue, a public holographic billboard flickered and switched to emergency crimson:\n\n> **MAXIMUM SECURITY ALERT:**  \n> CITIZEN MILEO CHEN (LEVEL 7 SPECIALIST).  \n> STATUS: UNAUTHORIZED DISCONNECTION // HOSTILE SUBJECT.  \n> IMMEDIATE NEURAL IMMOBILIZATION AND CAPTURE AUTHORIZED.\n\nThe high-pitched whine of a NeuroSec heavy assault drone screamed three blocks away, closing fast.\n\nMileo forced himself to his feet. He tore off his gray specialist tunic, hurled it into the mud, and ran toward a rusted ventilation grate leading down into the subterranean belly of the old city. With an agonizing heave, he lifted the heavy iron cover and dropped into the darkness just as the searchlights of the drone swept the alley floor.\n\nAs he scrambled down the maintenance ladder into Neo-Citania's forgotten labyrinth of tunnels, a faint glow began to flicker beneath the skin of his left wrist: a delicate web of bioluminescent lines in deep, vibrant indigo, pulsing in lockstep with his blood.\n\nThe Serpent's Coil had awakened.\n\nThe threshold was crossed. And there was no turning back.\n"}]}}];

          state.isTtsPaused = false;
          btn.textContent = '⏸ Pausar';
          status.textContent = ' ▂▃▅';
        } else {
          if (currentAiAudio) {
            currentAiAudio.pause();
          } else if (window.speechSynthesis) {
            window.speechSynthesis.pause();
          }
          state.isTtsPaused = true;
          btn.textContent = '▶ Reanudar';
          status.textContent = '(Pausado)';
        }
        return;
      }

      // Start narration
      stopTts();
      state.isCanceled = false;
      const book = BOOKS_DATA.find(b => b.id === state.bookId);
      const ch = book.chapters[state.lang][state.chapterIndex];
      const paras = ch.content.split('\n\n').map(p => p.trim()).filter(p => p && !p.startsWith('#') && !p.startsWith('---'));

      state.isTtsPlaying = true;
      state.isTtsPaused = false;
      btn.textContent = '⏸ Pausar';
      stopBtn.style.display = 'inline-flex';
      status.textContent = ' ▂▃▅▆▇';

      if (state.engine === 'ai' && window.puter && window.puter.ai) {
        playNextAI(paras, 0);
      } else {
        playNextBrowser(paras, 0);
      }
    }

    async function playNextAI(paras, idx) {
      if (state.isCanceled || idx >= paras.length) {
        stopTts();
        return;
      }

      state.activeParaIdx = idx;
      highlightPara(idx);

      const clean = paras[idx].replace(/[#*`_>—]/g, '').trim();
      const status = document.getElementById('tts-status');

      try {
        status.textContent = '⏳ Cargando IA...';
        const audio = await window.puter.ai.txt2speech(clean, {
          provider: 'aws-polly',
          voice: state.lang === 'es' ? 'Lucia' : 'Joanna'
        });

        if (state.isCanceled) return;

        currentAiAudio = audio;
        audio.playbackRate = state.speechRate;
        status.textContent = ' ▂▃▅▆▇ (Voz HD)';

        audio.onended = () => {
          if (!state.isCanceled) playNextAI(paras, idx + 1);
        };
        audio.onerror = () => playNextBrowser(paras, idx);
        audio.play();
      } catch (e) {
        console.warn('AI TTS error, fallback to browser:', e);
        playNextBrowser(paras, idx);
      }
    }

    function playNextBrowser(paras, idx) {
      if (state.isCanceled || idx >= paras.length) {
        stopTts();
        return;
      }

      state.activeParaIdx = idx;
      highlightPara(idx);

      const clean = paras[idx].replace(/[#*`_>—]/g, '').trim();
      const utt = new SpeechSynthesisUtterance(clean);
      utt.rate = state.speechRate;

      const voiceUri = document.getElementById('tts-voice-select').value;
      const voice = state.voices.find(v => v.voiceURI === voiceUri);
      if (voice) utt.voice = voice;

      utt.onend = () => {
        if (!state.isCanceled) playNextBrowser(paras, idx + 1);
      };
      utt.onerror = () => stopTts();

      window.speechSynthesis.speak(utt);
    }

    function stopTts() {
      state.isCanceled = true;
      if (currentAiAudio) {
        currentAiAudio.pause();
        currentAiAudio.currentTime = 0;
        currentAiAudio = null;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      state.isTtsPlaying = false;
      state.isTtsPaused = false;
      document.getElementById('btn-tts-play').textContent = '▶ Iniciar Narración';
      document.getElementById('btn-tts-stop').style.display = 'none';
      document.getElementById('tts-status').textContent = '';
      highlightPara(-1);
    }

    function onVoiceChange() {
      if (state.isTtsPlaying) {
        stopTts();
        toggleTtsPlay();
      }
    }

    function onRateChange(val) {
      state.speechRate = parseFloat(val) || 1.0;
      if (currentAiAudio) {
        currentAiAudio.playbackRate = state.speechRate;
      }
    }

    function toggleSolfeggioAudio() {
      const btn = document.getElementById('btn-solfeggio');
      if (state.solfeggioActive) {
        if (solfeggioGain && audioCtx) {
          solfeggioGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
          setTimeout(() => {
            if (solfeggioOsc) solfeggioOsc.stop();
          }, 1000);
        }
        state.solfeggioActive = false;
        btn.textContent = '🌊 Solfeggio 432 Hz';
        btn.style.color = 'var(--text)';
      } else {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        solfeggioOsc = audioCtx.createOscillator();
        solfeggioGain = audioCtx.createGain();

        solfeggioOsc.type = 'sine';
        solfeggioOsc.frequency.setValueAtTime(432, audioCtx.currentTime);

        solfeggioGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        solfeggioGain.gain.exponentialRampToValueAtTime(0.03, audioCtx.currentTime + 2);

        solfeggioOsc.connect(solfeggioGain);
        solfeggioGain.connect(audioCtx.destination);
        solfeggioOsc.start();

        state.solfeggioActive = true;
        btn.textContent = '🌊 432 Hz Activo';
        btn.style.color = '#38bdf8';
      }
    }

    function highlightPara(targetIdx) {
      const paras = document.querySelectorAll('.reader-body p');
      paras.forEach((p, i) => {
        if (i === targetIdx) {
          p.classList.add('spoken-active');
          p.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          p.classList.remove('spoken-active');
        }
      });
    }

    function populateBookSelect() {
      const select = document.getElementById('book-select');
      select.innerHTML = '';
      BOOKS_DATA.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id;
        opt.textContent = b.title[state.lang] || b.title.es;
        if (b.id === state.bookId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function changeBook(bookId) {
      stopTts();
      state.bookId = bookId;
      state.chapterIndex = 0;
      renderChapter();
    }

    function changeLang(lang) {
      stopTts();
      state.lang = lang;
      document.getElementById('btn-lang-es').style.background = lang === 'es' ? 'var(--accent)' : 'transparent';
      document.getElementById('btn-lang-es').style.color = lang === 'es' ? '#fff' : 'var(--text)';
      document.getElementById('btn-lang-en').style.background = lang === 'en' ? 'var(--accent)' : 'transparent';
      document.getElementById('btn-lang-en').style.color = lang === 'en' ? '#fff' : 'var(--text)';
      populateBookSelect();
      updateSampleCopy(lang);
      loadVoices();
      renderChapter();
    }

    function toggleToc() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function renderChapter() {
      const book = BOOKS_DATA.find(b => b.id === state.bookId) || BOOKS_DATA[0];
      const chapters = book.chapters[state.lang] || book.chapters.es;
      if (state.chapterIndex >= chapters.length) state.chapterIndex = 0;

      const ch = chapters[state.chapterIndex];

      document.getElementById('chapter-meta-tag').textContent = `${book.title[state.lang] || book.title.es} • ${ch.title}`;
      document.getElementById('chapter-meta-time').textContent = `${ch.readTime} de lectura • ${ch.wordCount} palabras`;
      document.getElementById('footer-chapter-title').textContent = ch.title;
      document.getElementById('chapter-page-num').textContent = `${state.chapterIndex + 1} / ${chapters.length}`;

      document.getElementById('btn-prev').disabled = state.chapterIndex === 0;
      document.getElementById('btn-next').disabled = state.chapterIndex === chapters.length - 1;

      // Render Markdown
      const body = document.getElementById('reader-body');
      const lines = ch.content.split('\n\n');
      let html = '';

      lines.forEach(l => {
        const trimmed = l.trim();
        if (!trimmed) return;

        if (trimmed.startsWith('# ')) {
          html += `<h1>${trimmed.replace('# ', '')}</h1>`;
        } else if (trimmed.startsWith('## ')) {
          html += `<h2>${trimmed.replace('## ', '')}</h2>`;
        } else if (trimmed.startsWith('### ')) {
          html += `<h3>${trimmed.replace('### ', '')}</h3>`;
        } else if (trimmed.startsWith('---') || trimmed.startsWith('***')) {
          html += `<hr />`;
        } else if (trimmed.startsWith('>')) {
          html += `<blockquote>${trimmed.replace(/^>\s*/, '')}</blockquote>`;
        } else {
          const isDialogue = trimmed.startsWith('—') || trimmed.startsWith('-');
          html += `<p class="${isDialogue ? 'dialogue' : ''}">${trimmed}</p>`;
        }
      });

      body.innerHTML = html;

      // Render Sidebar TOC
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      chapters.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = `toc-item ${idx === state.chapterIndex ? 'active' : ''}`;
        item.innerHTML = `<div>${c.title}</div><div style="font-size:0.75rem; color:var(--muted);">${c.readTime} • ${c.wordCount} pal.</div>`;
        item.onclick = () => {
          stopTts();
          state.chapterIndex = idx;
          toggleToc();
          renderChapter();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        tocList.appendChild(item);
      });

      window.scrollTo({ top: 0 });
      updateProgress();
    }

    function navigateChapter(dir) {
      stopTts();
      const book = BOOKS_DATA.find(b => b.id === state.bookId);
      const chapters = book.chapters[state.lang] || book.chapters.es;
      const next = state.chapterIndex + dir;
      if (next >= 0 && next < chapters.length) {
        state.chapterIndex = next;
        renderChapter();
      }
    }

    function toggleTheme() {
      const themes = ['dark', 'sepia', 'light', 'cosmic'];
      const curIdx = themes.indexOf(state.theme);
      state.theme = themes[(curIdx + 1) % themes.length];
      document.body.className = `theme-${state.theme}`;
    }

    function changeFontSize(delta) {
      state.fontSize = Math.min(32, Math.max(14, state.fontSize + delta));
      document.documentElement.style.setProperty('--font-size', `${state.fontSize}px`);
    }

    function updateProgress() {
      const h = document.documentElement;
      const b = document.body;
      const st = 'scrollTop' in h ? h.scrollTop : b.scrollTop;
      const sh = 'scrollHeight' in h ? h.scrollHeight : b.scrollHeight;
      const percent = Math.min(100, Math.max(0, Math.round((st / (sh - h.clientHeight)) * 100))) || 0;
      document.getElementById('scroll-progress-fill').style.width = `${percent}%`;
      document.getElementById('scroll-progress-text').textContent = `${percent}%`;
    }

    window.onload = init;
  </script>
</body>
</html>
