<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalChain | Investor Pitch Deck</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg?v=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pitch: #06060a;
            --slide-bg: rgba(255, 255, 255, 0.03);
            --primary: #14f195;
            --secondary: #9945ff;
        }

        body.pitch-mode {
            background: var(--bg-pitch);
            color: #fff;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .pitch-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1a1a2e 0%, #06060a 100%);
        }

        .slide {
            display: none;
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            background: var(--slide-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 4rem;
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-out;
            position: relative;
            flex-direction: column;
            justify-content: center;
        }

        .slide.active { display: flex; }

        .slide-header {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .slide-content {
            font-size: 1.4rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        .slide-content ul { list-style: none; padding: 0; }
        .slide-content li { margin-bottom: 1rem; padding-left: 2rem; position: relative; }
        .slide-content li::before { content: '→'; position: absolute; left: 0; color: var(--primary); }

        .slide-footer {
            position: absolute;
            bottom: 2rem;
            right: 4rem;
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 800;
        }

        /* Controles */
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;
        }

        .btn-control {
            background: var(--glass);
            border: 1px solid var(--border);
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-control:hover { background: var(--primary); color: #000; }

        .lang-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
        }

        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos específicos para tablas de comparación */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1.5rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: var(--primary); text-transform: uppercase; font-size: 0.9rem; }

        /* Botón de Salida */
        .exit-pitch {
            position: fixed;
            top: 2rem;
            left: 2rem;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 2rem;
            font-weight: 300;
            z-index: 9999;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .exit-pitch:hover {
            background: var(--primary);
            color: #000;
            transform: rotate(90deg) scale(1.1);
            border-color: var(--primary);
        }
    </style>
</head>
<body class="pitch-mode">

    <div class="lang-toggle">
        <button class="btn-control" onclick="toggleLanguage()">ES / EN</button>
    </div>

    <!-- Botón de Salida -->
    <a href="index.html" class="exit-pitch" title="Volver al Inicio (ESC)">
        <span>&times;</span>
    </a>

    <div class="pitch-container" id="pitchContainer">
        <!-- Las slides se cargan dinámicamente aquí -->
    </div>

    <div class="controls">
        <button class="btn-control" onclick="prevSlide()">← Anterior</button>
        <button class="btn-control" onclick="nextSlide()">Siguiente →</button>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <script>
        const slidesData = {
            es: [
                { title: "Nuestra Visión", content: "<strong>Dominar el deporte más grande del mundo mediante la descentralización.</strong><br><br>GoalChain es la infraestructura definitiva para el fanático del fútbol del siglo XXI. Nuestra visión es crear un metaverso deportivo donde la pasión no solo se viva, sino que se posea. Buscamos convertirnos en el estándar de facto para el 'Football Finance' (FootFi)." },
                { title: "La Oportunidad", content: "Estamos ante la convergencia de tres tormentas perfectas:<br><ul><li><strong>Adopción Solana:</strong> Velocidad y costos ínfimos para micro-apuestas.</li><li><strong>Mundial 2026:</strong> El primero con 48 selecciones y audiencia récord.</li><li><strong>Fatiga Web2:</strong> Los fans exigen transparencia y pagos instantáneos que solo la blockchain puede ofrecer *ahora mismo*." },
                { title: "Problema vs Solución", content: "<table><tr><th>Tradicional</th><th>GoalChain (Web3)</th></tr><tr><td>Opacidad de Cuotas</td><td>Parimutuel 100% On-Chain</td></tr><tr><td>Custodia de Fondos</td><td>Self-Custody (Directo a Wallet)</td></tr><tr><td>Retiros Lentos</td><td>Pagos Automáticos Instantáneos</td></tr></table><br><p style='font-size:0.9rem;opacity:0.8;'>El sistema tradicional está diseñado para que el usuario pierda. GoalChain está diseñado para que el ecosistema crezca devolviendo el margen al jugador.</p>" },
                { title: "Genesis Squad", content: "1,248 leyendas que son activos productivos reales:<br><ul><li><strong>Yield Diario:</strong> Generan $GCH de forma pasiva a través del staking del tesoro.</li><li><strong>Infinity Burn:</strong> El rendimiento del tesoro recompra y quema tokens perpetuamente.</li><li><strong>Stamina System:</strong> Gestión estratégica de energía y rendimiento real.</li><li><strong>Gobernanza:</strong> Voto prioritario en la DAO institucional.</li></ul>" },
                { title: "Contrato Profesional", content: "Eleva tu juego al nivel institucional con herramientas avanzadas:<br><ul><li><strong>Revenue Share:</strong> Gana de las apuestas de tus referidos vitaliciamente.</li><li><strong>Seguridad Inmutable:</strong> Autoridad de contrato revocada para protección total del usuario.</li><li><strong>Dashboard IA:</strong> Analítica predictiva para optimizar tus apuestas.</li></ul>" },
                { title: "Tokenomics 2.0", content: "<strong>Flujo Circular Sostenible (40/30/30):</strong><br><br>Ingresos → Contrato de Tesorería → Reparto Automático:<br><ul><li><strong>40% Jackpot:</strong> Premios masivos para ganadores.</li><li><strong>30% World Reserve:</strong> Staking en SOL/BTC para financiar el Infinity Burn.</li><li><strong>30% Ecosistema:</strong> Desarrollo y expansión global.</li></ul>" },
                { title: "Roadmap 2026", content: "<ul><li><strong>Q1 2026:</strong> Fundación y Smart Contracts (Anchor). (Hecho)</li><li><strong>Q2 2026:</strong> Oracle de Fixtures y Auditoría. (En curso)</li><li><strong>Q3 2026:</strong> Mint de Genesis Squad y Marketplace Opening.</li><li><strong>11 JUN 2026:</strong> 🚀 LANZAMIENTO OFICIAL (Kick-off Mundial).</li></ul>" },
                { title: "Los Fundadores", content: "<ul><li><strong>Nico Pez (Mastermind):</strong> En blockchain desde 2016. Artista y matemático.</li><li><strong>Lucas Bello (The Artist):</strong> Director de Arte 3D y control de estrés del sistema.</li><li><strong>Lara Lo Beluzzo (Senior Dev):</strong> Arquitecta técnica y experta en Solana Rust.</li></ul>" }
            ],
            en: [
                { title: "Our Vision", content: "<strong>Dominating the world's biggest sport through decentralization.</strong><br><br>GoalChain is the ultimate infrastructure for the 21st-century football fan. Our vision is to create a sports metaverse where passion is not just lived, but owned. We aim to become the de-facto standard for 'Football Finance' (FootFi)." },
                { title: "The Opportunity", content: "We are at the convergence of three perfect storms:<br><ul><li><strong>Solana Adoption:</strong> Tiny fees and speed for real-time micro-betting.</li><li><strong>2026 World Cup:</strong> First with 48 teams and record-breaking audience.</li><li><strong>Web2 Fatigue:</strong> Fans demand transparency and instant payouts that only blockchain can offer *right now*." },
                { title: "Problem vs Solution", content: "<table><tr><th>Traditional</th><th>GoalChain (Web3)</th></tr><tr><td>Opaque Odds</td><td>100% On-Chain Parimutuel</td></tr><tr><td>Fund Custody</td><td>Self-Custody (Direct to Wallet)</td></tr><tr><td>Slow Withdrawals</td><td>Instant Automated Payouts</td></tr></table><br><p style='font-size:0.9rem;opacity:0.8;'>Traditional systems are designed for the user to lose. GoalChain is designed for the ecosystem to grow by returning margins to players.</p>" },
                { title: "Genesis Squad", content: "1,248 legends that are real productive assets:<br><ul><li><strong>Daily Yield:</strong> Earn $GCH passively through treasury staking.</li><li><strong>Infinity Burn:</strong> Treasury yield repurchases and burns tokens perpetually.</li><li><strong>Stamina System:</strong> Strategic management of energy and real-world performance.</li><li><strong>Governance:</strong> Priority voting in the institutional DAO.</li></ul>" },
                { title: "Professional Contract", content: "Elevate your game to institutional levels with advanced tools:<br><ul><li><strong>Revenue Share:</strong> Earn from your referrals' bets for life.</li><li><strong>Immutable Security:</strong> Revoked contract authority for total user protection.</li><li><strong>AI Dashboard:</strong> Predictive analytics to optimize your betting.</li></ul>" },
                { title: "Tokenomics 2.0", content: "<strong>Sustainable Circular Flow (40/30/30):</strong><br><br>Income → Treasury Contract → Automatic Distribution:<br><ul><li><strong>40% Jackpot:</strong> Massive prizes for winners.</li><li><strong>30% World Reserve:</strong> SOL/BTC Staking to fuel the Infinity Burn.</li><li><strong>30% Ecosystem:</strong> Global development and expansion.</li></ul>" },
                { title: "Roadmap 2026", content: "<ul><li><strong>Q1 2026:</strong> Foundation & Smart Contracts (Anchor). (Done)</li><li><strong>Q2 2026:</strong> Fixture Oracle & Security Audit. (In Progress)</li><li><strong>Q3 2026:</strong> Genesis Squad Mint & Marketplace Opening.</li><li><strong>JUNE 11, 2026:</strong> 🚀 OFFICIAL LAUNCH (World Cup Kick-off).</li></ul>" },
                { title: "The Founders", content: "<ul><li><strong>Nico Pez (Mastermind):</strong> In blockchain since 2016. Artist and mathematician.</li><li><strong>Lucas Bello (The Artist):</strong> 3D Art Director and system stress testing.</li><li><strong>Lara Lo Beluzzo (Senior Dev):</strong> Technical architect and Solana Rust expert.</li></ul>" }
            ]
        };

        let currentLang = 'es';
        let currentSlide = 0;

        function renderSlides() {
            const container = document.getElementById('pitchContainer');
            container.innerHTML = slidesData[currentLang].map((slide, index) => `
                <div class="slide ${index === currentSlide ? 'active' : ''}">
                    <div class="slide-header">${slide.title}</div>
                    <div class="slide-content">${slide.content}</div>
                    <div class="slide-footer">GOALCHAIN 2026 | SLIDE ${index + 1} / ${slidesData[currentLang].length}</div>
                </div>
            `).join('');
            updateProgress();
        }

        function nextSlide() {
            if (currentSlide < slidesData[currentLang].length - 1) {
                currentSlide++;
                renderSlides();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlides();
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            renderSlides();
        }

        function updateProgress() {
            const progress = ((currentSlide + 1) / slidesData[currentLang].length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'Escape') window.location.href = 'index.html';
        });

        renderSlides();
    </script>
</body>
</html>
