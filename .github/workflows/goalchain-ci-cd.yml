# Trigger deploy: 2026-05-24T06:00:00
name: GoalChain CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'players.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite ejecución manual desde la pestaña "Actions"

jobs:
  validate-nfts:
    name: 🔍 Validar imágenes NFT y naming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validar convención de nombres de imágenes
        run: |
          python3 << 'EOF'
          import os
          import re
          import sys

          # Real NFT asset directory (used by the webapp / wallet cards).
          nft_dir = "docs/assets/img/nfts"
          if not os.path.isdir(nft_dir):
              print("❌ Carpeta %s no encontrada" % nft_dir)
              sys.exit(1)

          # Player cards: 3 dígitos + _ + nombre (minúsculas, acentos, guiones) + .webp/.png/.jpg
          pattern = re.compile(r'^\d{3}_[a-z0-9À-ÿ_-]+\.(webp|png|jpg)$', re.IGNORECASE)
          # Generated subdirs (composed/bg/transparent) and the placeholder are allowed.
          allow = {"card_placeholder_soon.png"}

          invalid_files = []
          for entry in sorted(os.listdir(nft_dir)):
              path = os.path.join(nft_dir, entry)
              if os.path.isdir(path):       # composed/ bg/ transparent/ are build artifacts
                  continue
              if entry in allow:
                  continue
              if not pattern.match(entry):
                  invalid_files.append(entry)

          if invalid_files:
              print("❌ Archivos con nombre inválido:")
              for f in invalid_files:
                  print("   - %s" % f)
              print("\nFormato esperado: 001_lionel_satoshi.webp (3 dígitos + _ + minúsculas/acentos/guiones)")
              sys.exit(1)
          else:
              print("✅ Todas las imágenes cumplen la convención de nombres")
          EOF

      - name: Verificar integridad de imágenes (tamaño mínimo)
        run: |
          find docs/assets/img/nfts -maxdepth 1 -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.webp" \) -exec sh -c '
            for f; do
              size=$(stat -c%s "$f")
              if [ "$size" -lt 50000 ]; then
                echo "⚠️  Imagen muy pequeña (posible error): $f ($size bytes)"
              fi
            done
          ' sh {} +

  deploy:
    name: 🚀 Desplegar a GitHub Pages
    needs: validate-nfts
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
