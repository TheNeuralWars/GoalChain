name: 🔒 Backup & Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─── JOB 1: Backup to Google Drive ─────────────────────────────────────────
  backup-gdrive:
    name: 💾 Backup to Google Drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Sync to Google Drive
        run: |
          rclone sync ./ gdrive:GoalChain_Backup \
            --progress \
            --exclude ".git/**" \
            --exclude "node_modules/**" \
            --exclude "*.zip" \
            --exclude "_archive/**" \
            --exclude "test-ledger/**"

  # ─── JOB 2: Purge Cloudflare Cache ──────────────────────────────────────────
  purge-cloudflare:
    name: ⚡ Purge Cloudflare Cache
    runs-on: ubuntu-latest
    needs: backup-gdrive
    steps:
      - name: Purge Cloudflare Cache
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/cf_result.json
          
          SUCCESS=$(cat /tmp/cf_result.json | python3 -c "import sys,json; print(json.load(sys.stdin)['success'])")
          if [ "$SUCCESS" != "True" ]; then
            echo "❌ Cloudflare purge failed"
            cat /tmp/cf_result.json
            exit 1
          fi
          echo "✅ Cloudflare cache purged successfully"
