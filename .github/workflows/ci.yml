name: GoalChain CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:

jobs:
  goalchain-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain-sdk/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  goalchain-api:
    runs-on: ubuntu-latest
    needs: goalchain-sdk
    defaults:
      run:
        working-directory: goalchain_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_api/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  goalchain-program-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_program
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  goalchain-oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_oracle/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
