name: GoalChain CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:

permissions:
  contents: read

jobs:
  goalchain-program-idl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author (fix Vercel email check)
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('goalchain_program/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.18/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 1.0.2
          avm use 1.0.2
        shell: bash

      - name: Verify installations
        run: |
          solana --version
          anchor --version
        shell: bash

      - name: Install program npm deps
        run: npm ci
        working-directory: goalchain_program

      - name: Build Anchor program and generate IDL
        run: anchor build --ignore-keys
        working-directory: goalchain_program
        env:
          ANCHOR_SKIP_IDL_BUILD: false

      - name: Verify IDL sync targets
        run: bash scripts/sync-idl.sh --check

  goalchain-sdk:
    runs-on: ubuntu-latest
    needs: goalchain-program-idl
    defaults:
      run:
        working-directory: goalchain-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain-sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  goalchain-api:
    runs-on: ubuntu-latest
    needs: goalchain-sdk
    defaults:
      run:
        working-directory: goalchain_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  goalchain-program-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_program
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  goalchain-oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_oracle/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint