name: GoalChain CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================
  # ALL JOBS → Self-hosted runner (VPS ARM64, persistent cache, unlimited minutes)
  # Solana/Anchor will be available once build completes (~30 min one-time)
  # ============================================
  goalchain-program-idl:
    runs-on: [self-hosted, arm64, hermes, goalchain, solana]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author (fix Vercel email check)
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('goalchain_program/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install Anchor (if not present)
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$HOME/.cargo/bin:$PATH"
          if ! command -v anchor &> /dev/null; then
            echo "Anchor not found, installing via cargo..."
            cargo install anchor-cli --locked
          else
            echo "Anchor already installed"
          fi
          anchor --version

      - name: Verify Solana/Anchor installations
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          solana --version
          anchor --version
        shell: bash

      - name: Install program npm deps
        run: npm ci
        working-directory: goalchain_program

      - name: Build Anchor program and generate IDL
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          anchor build --ignore-keys
        working-directory: goalchain_program
        env:
          ANCHOR_SKIP_IDL_BUILD: false

      - name: Verify IDL sync targets
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          bash scripts/sync-idl.sh --check

  goalchain-sdk:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    needs: goalchain-program-idl
    defaults:
      run:
        working-directory: goalchain-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain-sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  goalchain-api:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    needs: goalchain-sdk
    defaults:
      run:
        working-directory: goalchain_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  goalchain-program-ts:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    defaults:
      run:
        working-directory: goalchain_program
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  goalchain-oracle:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    defaults:
      run:
        working-directory: goalchain_oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_oracle/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint