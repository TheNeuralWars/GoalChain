name: GoalChain CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:

permissions:
  contents: read

jobs:
  goalchain-program-idl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Solana CLI
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor AVM
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
      - name: Install Anchor CLI
        run: |
          avm install 1.0.2
          avm use 1.0.2
      - name: Install program npm deps
        run: npm ci
        working-directory: goalchain_program
      - name: Build Anchor program and generate IDL
        run: anchor build --ignore-keys
        working-directory: goalchain_program
      - name: Verify IDL sync targets
        run: bash scripts/sync-idl.sh --check

  goalchain-sdk:
    runs-on: ubuntu-latest
    needs: goalchain-program-idl
    defaults:
      run:
        working-directory: goalchain-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain-sdk/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  goalchain-api:
    runs-on: ubuntu-latest
    needs: goalchain-sdk
    defaults:
      run:
        working-directory: goalchain_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_api/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  goalchain-program-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_program
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  goalchain-webapp:
    name: Webapp build (issue #131)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_webapp/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke check — client exports
        run: |
          node -e "
            const fs = require('fs');
            const src = 'src/lib/goalchainClient.ts';
            if (!fs.existsSync(src)) { console.error('missing: ' + src); process.exit(1); }
            console.log('client exports check passed');
          "

  goalchain-oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goalchain_oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_oracle/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
