name: GoalChain CI

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================
  # SOLANA/ANCHOR BUILD → GitHub-hosted (ARM64 supported via action)
  # ============================================
  goalchain-program-idl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author (fix Vercel email check)
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('goalchain_program/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Setup Solana CLI
        uses: solana-labs/setup-solana@v1
        with:
          version: "1.18.18"
          cache: true

      - name: Setup Anchor
        uses: actions/cache@v4
        with:
          path: ~/.avm
          key: ${{ runner.os }}-anchor-${{ hashFiles('goalchain_program/Anchor.toml') }}
          restore-keys: |
            ${{ runner.os }}-anchor-

      - name: Install Anchor AVM
        if: steps.setup-anchor.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 1.0.2
          avm use 1.0.2
        shell: bash

      - name: Verify installations
        run: |
          solana --version
          anchor --version
        shell: bash

      - name: Install program npm deps
        run: npm ci
        working-directory: goalchain_program

      - name: Build Anchor program and generate IDL
        run: anchor build --ignore-keys
        working-directory: goalchain_program
        env:
          ANCHOR_SKIP_IDL_BUILD: false

      - name: Verify IDL sync targets
        run: bash scripts/sync-idl.sh --check

  # ============================================
  # PURE NODE/TS JOBS → Self-hosted runner (VPS ARM64, persistent cache, unlimited minutes)
  # ============================================
  goalchain-sdk:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    needs: goalchain-program-idl
    defaults:
      run:
        working-directory: goalchain-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain-sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  goalchain-api:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    needs: goalchain-sdk
    defaults:
      run:
        working-directory: goalchain_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  goalchain-program-ts:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    defaults:
      run:
        working-directory: goalchain_program
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_program/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  goalchain-oracle:
    runs-on: [self-hosted, arm64, hermes, goalchain]
    defaults:
      run:
        working-directory: goalchain_oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.name "GoalChain Bot"
          git config user.email "goalchain-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goalchain_oracle/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint