<!DOCTYPE html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESC}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    {{HREFLANGS}}
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoalWorld" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />
    {{OG_LOCALE_ALTERNATES}}
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESC}}" />
    <meta property="og:image" content="https://goalworld.fun/assets/img/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{t:chrome.og_image_alt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESC}}" />
    <meta name="twitter:image" content="https://goalworld.fun/assets/img/og-image.jpg" />

    <link rel="icon" href="/assets/img/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/img/logo-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="ard" href="/.well-known/ard.json" type="application/ai-catalog+json" />
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" type="application/ai-catalog+json" />
    <link rel="alternate" type="application/atom+xml" title="GoalWorld Live Build Log (Atom)" href="https://goalworld.fun/feed.xml" />
    <link rel="alternate" type="application/feed+json" title="GoalWorld Live Build Log (JSON Feed)" href="https://goalworld.fun/feed.json" />

    <link rel="preload" href="/assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/site.css" />
    {{PRELOAD}}
    {{JSONLD}}
    <script src="/assets/js/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">{{t:chrome.skip}}</a>
    {{PARTIAL_HEADER}}

    <main id="main" class="page-main">{{BODY}}</main>
    {{PARTIAL_STICKY_CTA}}

    {{PARTIAL_FOOTER}}
  </body>
</html>
